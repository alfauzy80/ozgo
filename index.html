    // ===== AUDIO NOTIFIKASI CHAT & PESANAN MASUK DRIVER (WEB AUDIO API) =====
    let audioCtx = null;

    const DRIVER_ORDER_SOUNDS = [
      { id: 'alarm-ozgo', label: 'Alarm Order OZgo (Panjang & Keras)', durationLabel: '~3.2 dtk', desc: 'Nada peringatan berulang keras & jelas seperti order ojek prioritas.' },

      { id: 'bel-express', label: 'Bel Express Beruntun', durationLabel: '~3.1 dtk', desc: 'Rentetan bel 4 siklus nada tinggi yang tegas & panjang.' },
      { id: 'sirine-prioritas', label: 'Sirine Prioritas Panjang', durationLabel: '~3.4 dtk', desc: 'Gelombang sirine naik-turun panjang untuk kondisi bising / di motor.' },
    ];
    function getAudioCtx() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) audioCtx = new Ctx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playChatChime() {
      try {
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime;
        [{ f: 880, t: 0, d: 0.14 }, { f: 1174.66, t: 0.13, d: 0.22 }].forEach(({ f, t, d }) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + t);
          gain.gain.setValueAtTime(0.0001, now + t);
          gain.gain.exponentialRampToValueAtTime(0.2, now + t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + t + d);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + t); osc.stop(now + t + d + 0.02);
        });
      } catch {}
    }
    function stopOrderAlert() {
      activeOrderNodes.forEach((n) => {
        try { if (typeof n.stop === 'function') n.stop(); } catch {}
        try { n.disconnect(); } catch {}
      });
      activeOrderNodes = [];
    }
    function playOrderAlert(soundId = 'alarm-ozgo') {
      try {
        stopOrderAlert();
        const ctx = getAudioCtx();
        if (!ctx) return;
        const now = ctx.currentTime + 0.02;
        const comp = ctx.createDynamicsCompressor();
        comp.threshold.setValueAtTime(-14, now);
        comp.knee.setValueAtTime(12, now);
        comp.ratio.setValueAtTime(8, now);
        comp.attack.setValueAtTime(0.003, now);
        comp.release.setValueAtTime(0.15, now);
        const master = ctx.createGain();
        master.gain.setValueAtTime(0.88, now);
        comp.connect(master); master.connect(ctx.destination);
        activeOrderNodes.push(comp, master);

        const tone = (freq, start, dur, type = 'sawtooth', peak = 0.42, endFreq = null) => {
          const osc = ctx.createOscillator();
          const g = ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, now + start);
          if (endFreq !== null) osc.frequency.linearRampToValueAtTime(endFreq, now + start + dur);
          g.gain.setValueAtTime(0.0001, now + start);
          g.gain.exponentialRampToValueAtTime(peak, now + start + 0.015);
          g.gain.setValueAtTime(peak * 0.9, now + start + Math.max(0.02, dur - 0.04));
          g.gain.exponentialRampToValueAtTime(0.0001, now + start + dur);
          osc.connect(g); g.connect(comp);
          osc.start(now + start); osc.stop(now + start + dur + 0.03);
          activeOrderNodes.push(osc, g);
        };

        if (soundId === 'dering-klasik') {
          [0, 0.78, 1.56, 2.34].forEach((b) => {
            for (let i = 0; i < 6; i++) {
              const s = b + i * 0.095;
              tone(940, s, 0.08, 'square', 0.34);
              tone(1240, s, 0.08, 'triangle', 0.32);
            }
          });
        } else if (soundId === 'bel-express') {
          [0, 0.78, 1.56, 2.34].forEach((b) => {
            tone(1046.5, b, 0.14, 'triangle', 0.44);
            tone(1318.5, b + 0.13, 0.14, 'triangle', 0.46);
            tone(1567.98, b + 0.26, 0.14, 'square', 0.36);
            tone(2093.0, b + 0.39, 0.24, 'triangle', 0.48);
          });
        } else if (soundId === 'sirine-prioritas') {
          [0, 0.85, 1.7, 2.55].forEach((b) => {
            tone(740, b, 0.42, 'sawtooth', 0.38, 1480);
            tone(1480, b + 0.42, 0.4, 'sawtooth', 0.38, 780);
            tone(1110, b, 0.82, 'triangle', 0.22, 1660);
          });
        } else {
          [0, 0.82, 1.64, 2.46].forEach((b) => {
            tone(880, b, 0.14, 'square', 0.36);
            tone(1174.66, b + 0.15, 0.14, 'square', 0.38);
            tone(1567.98, b + 0.3, 0.28, 'sawtooth', 0.4);
            tone(1567.98, b + 0.3, 0.28, 'triangle', 0.35);

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (m) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
    const fmtTime = (ms) => new Date(ms).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    function normalizeWA(phone) {
      const d = String(phone || '').replace(/\D+/g, '');
      if (!d) return '';
      if (d.startsWith('0')) return '62' + d.slice(1);
      if (d.startsWith('8')) return '62' + d;
      return d;
    }
    function isValidWA(phone) {
      const n = normalizeWA(phone);
      return n.length >= 10 && n.length <= 16;
    }
    const distBetweenKm = (lat1, lng1, lat2, lng2) => {
      const R = 6371, dLat = (lat2 - lat1) * Math.PI / 180, dLng = (lng2 - lng1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
    };
    const distKm = (lat, lng) => distBetweenKm(CONFIG.center.lat, CONFIG.center.lng, lat, lng);

    const statusLabel = (s) => ({ pending: 'Menunggu Driver', assigned: 'Driver Menuju Lokasi', in_progress: 'Sedang Diantar', completed: 'Selesai', cancelled: 'Dibatalkan' }[s] || s);

    // ===== IMAGE COMPRESSOR (240x240 JPEG <= 65KB) & PROFILE AVATAR HELPER =====
    function compressPhotoFile(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type.startsWith('image/')) { reject(new Error('Pilih file gambar (JPG/PNG/WebP).')); return; }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error('Gagal membaca file gambar.'));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error('Format gambar tidak didukung.'));
          img.onload = () => {
            const size = 240;
            const canvas = document.createElement('canvas');

            const side = Math.min(img.width, img.height);
            const sx = (img.width - side) / 2;
            const sy = (img.height - side) / 2;
            ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
            let q = 0.78;
            let url = canvas.toDataURL('image/jpeg', q);
            while (url.length > 62000 && q > 0.35) { q -= 0.1; url = canvas.toDataURL('image/jpeg', q); }
            resolve(url);
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      const norm = String(email || '').trim().toLowerCase();
      if (norm !== CONFIG.superAdminEmail.toLowerCase()) return false;
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(`ozgo-admin-v1:${norm}:${password}`));

    function derToP1363(der, len = 32) {
      if (der.length < 8 || der[0] !== 0x30) throw new Error('Tanda tangan ECDSA tidak valid');
      let o = 1, sl = der[o++];
      if (sl & 0x80) { const nb = sl & 0x7f; o += nb; }
      if (der[o++] !== 0x02) throw new Error('Komponen r hilang');
      const rLen = der[o++]; const rRaw = der.slice(o, o + rLen); o += rLen;
      if (der[o++] !== 0x02) throw new Error('Komponen s hilang');
      const sLen = der[o++]; const sRaw = der.slice(o, o + sLen);
      const normInt = (raw) => {
        let i = 0; while (i < raw.length && raw[i] === 0) i++;
        const t = raw.slice(i); const out = new Uint8Array(len);
        out.set(t, len - t.length); return out;

      out.set(normInt(rRaw), 0); out.set(normInt(sRaw), len);

    async function enrollRealFingerprint() {

      const rpId = getRpId();

        const resp = cred.response;
        let signCount = 0;
        if (typeof resp.getAuthenticatorData === 'function') {
          const ad = new Uint8Array(resp.getAuthenticatorData());
          if (ad.length >= 37) {
            const flags = ad[32];
            if ((flags & 0x01) === 0 || (flags & 0x04) === 0) return { ok: false, error: 'Verifikasi sidik jari perangkat (UV) tidak terpenuhi.' };
            signCount = new DataView(ad.buffer, ad.byteOffset + 33, 4).getUint32(0, false);
          }

        const spki = typeof resp.getPublicKey === 'function' && resp.getPublicKey() ? bytesToB64Url(new Uint8Array(resp.getPublicKey())) : null;
        const alg = typeof resp.getPublicKeyAlgorithm === 'function' ? resp.getPublicKeyAlgorithm() : -7;
        const enrolled = { credentialId: bytesToB64Url(new Uint8Array(cred.rawId)), publicKeySpki: spki, algorithm: alg, rpId: rpId || location.hostname, email: CONFIG.superAdminEmail, signCount, enrolledAtMs: Date.now() };
        saveJSON(WEBAUTHN_KEY, enrolled);

    async function loginRealFingerprint() {
      const stored = loadBiometricCred();
      if (!stored) return { ok: false, error: 'Sidik jari belum terdaftar di perangkat ini.' };
      const sup = await detectBiometricSupport();
      if (!sup.supported) return { ok: false, error: sup.reason };
      const challenge = new Uint8Array(32); crypto.getRandomValues(challenge);
      const expectedChallenge = bytesToB64Url(challenge);
      const rpId = getRpId() || stored.rpId;

        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge, rpId,
            allowCredentials: [{ id: b64UrlToBytes(stored.credentialId), type: 'public-key', transports: ['internal'] }],

          },
        });
        if (!assertion) return { ok: false, error: 'Sensor sidik jari tidak merespons.' };

        const cd = JSON.parse(new TextDecoder().decode(cdBytes));
        if (cd.type !== 'webauthn.get' || cd.challenge !== expectedChallenge || cd.origin !== location.origin) {

        if (ad.length < 37 || (ad[32] & 0x01) === 0 || (ad[32] & 0x04) === 0) {
          return { ok: false, error: 'Verifikasi sidik jari (UP/UV) tidak terpenuhi.' };
        }
        const expectedRpHash = bytesToHex(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(rpId))));
        if (bytesToHex(ad.slice(0, 32)) !== expectedRpHash) return { ok: false, error: 'RP ID hash tidak cocok.' };

        order.assignedDriverId && order.assignedDriverId !== CONFIG.superAdminDriverUid && !prevDeclined.includes(order.assignedDriverId)
          ? [...prevDeclined, order.assignedDriverId]
          : [...prevDeclined];
      const nextMatch = findNearestDriver(CONFIG.center.lat, CONFIG.center.lng, nextDeclined);
      if (nextMatch && !nextMatch.isAdminFallback) {
        order.assignedDriverId = nextMatch.driver.uid;
        order.assignedDriverName = nextMatch.driver.name;
        order.driverPhotoUrl = nextMatch.driver.photoDataUrl || '';
        order.status = 'pending';
        order.offerStatus = 'offering';
        order.offerExpiresAtMs = Date.now() + ORDER_OFFER_TIMEOUT_MS;
        order.declinedDriverIds = nextDeclined;
        showToast(`${reasonLabel} Pesanan #${order.orderId} dialihkan ke ${nextMatch.driver.name} (40 dtk)`, 'info');
        if (state.orderSoundEnabled && state.activeDriverUid === nextMatch.driver.uid) {
          playOrderAlert(state.orderSoundId);
          notifyDriverOS(order);
        }
      } else {
        const adminDrv = nextMatch?.driver || state.drivers.find((d) => d.uid === CONFIG.superAdminDriverUid);
        order.assignedDriverId = adminDrv?.uid || CONFIG.superAdminDriverUid;
        order.assignedDriverName = adminDrv?.name || 'Admin Utama OZgo';
        order.driverPhotoUrl = adminDrv?.photoDataUrl || '';
        order.status = 'assigned';
        order.offerStatus = 'escalated_admin';
        order.offerExpiresAtMs = 0;
        order.declinedDriverIds = nextDeclined;
        showToast(`${reasonLabel} Pesanan #${order.orderId} otomatis dialihkan ke Admin Utama OZgo`, 'info');
      }
      persistAll();

      toastTimer = setTimeout(() => el.classList.add('hidden'), 3800);

    const openWA = (text) => {
      const a = document.createElement('a');
      a.href = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
      a.target = '_blank'; a.rel = 'noopener noreferrer';
      document.body.appendChild(a); a.click(); a.remove();
    };

    // Cover screen behavior
    const coverEl = document.getElementById('app-cover');
    if (new URLSearchParams(location.search).get('autostart') === '1') {
      coverEl.style.display = 'none';
    }
    const dismissCover = () => {
      coverEl.classList.add('hide');
      renderPwaBanner();
      setTimeout(() => { coverEl.style.display = 'none'; renderPwaBanner(); }, 550);

    document.getElementById('cover-dismiss-btn').addEventListener('click', (e) => { e.stopPropagation(); dismissCover(); });

    // Firebase Auth Listener
    if (fbAuth) {
      onAuthStateChanged(fbAuth, async (user) => {
        if (!user) return;
        const email = (user.email || '').toLowerCase();
        const isSA = email === CONFIG.superAdminEmail.toLowerCase();
        state.isSuperAdmin = isSA;
        state.activeDriverUid = isSA ? CONFIG.superAdminDriverUid : user.uid;
        if (isSA && fbDb) {
          try {
            const ref = doc(fbDb, 'drivers', user.uid);
            const snap = await getDoc(ref);
            if (!snap.exists()) {
              await setDoc(ref, {
                uid: user.uid, name: user.displayName || 'Admin Utama OZgo', email, phone: '08568080847',
                vehicleType: 'motor', vehicleModel: 'Honda PCX 160 Hitam', area: 'Rangkasbitung Pusat & Mabu',
                approvalStatus: 'approved', isOnline: false, createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
              });
            }
            onSnapshot(collection(fbDb, 'driver_applications'), (qs) => {
              const incoming = qs.docs.map((d) => ({ ...d.data(), uid: d.data().uid || d.id }));
              let newlyArrived = null;
              incoming.forEach((app) => {
                const idx = state.drivers.findIndex((x) => x.uid === app.uid);
                if (idx >= 0) state.drivers[idx] = { ...state.drivers[idx], ...app };
                else state.drivers = [app, ...state.drivers];
                if (app.approvalStatus === 'pending' && !seenPendingDriverIds.has(app.uid)) {
                  seenPendingDriverIds.add(app.uid);
                  newlyArrived = app;
                }
              });
              persistAll();
              if (newlyArrived) notifyAdminNewDriver(newlyArrived);
              render();
            }, () => {});
          } catch {}
        }
        render();
      });
    }

    // ===== LEAFLET MAP =====
    let activeMap = null;
    function mountLeafletMap(containerId, driverList) {
      const el = document.getElementById(containerId);
      if (!el || typeof L === 'undefined') return;
      if (activeMap) { activeMap.remove(); activeMap = null; }
      const center = driverList.length === 1 ? [driverList[0].lat, driverList[0].lng] : [CONFIG.center.lat, CONFIG.center.lng];
      activeMap = L.map(el, { zoomControl: true }).setView(center, 14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap', maxZoom: 19 }).addTo(activeMap);
      driverList.forEach((d) => {
        const icon = L.divIcon({
          className: '',
          html: `<div class="ozgo-pin" style="background:${d.isOnline ? '#059669' : '#64748b'}">🏍️</div>`,
          iconSize: [34, 34], iconAnchor: [17, 17],
        });
        L.marker([d.lat, d.lng], { icon })
          .addTo(activeMap)
          .bindPopup(`<b>${esc(d.name)}</b><br/>${esc(d.vehicleModel)}<br/><span style="color:${d.isOnline ? '#059669' : '#64748b'};font-weight:700">${d.isOnline ? 'ONLINE' : 'OFFLINE'}</span> · ${d.speed || 0} km/j`);
      });
    }

    // ===== CHAT (ORDER & DRIVER-ADMIN) =====
    function buildDriverReply(text) {
      const l = text.toLowerCase();
      if (l.includes('mana') || l.includes('posisi') || l.includes('sampai')) return 'Saya sedang meluncur ke titik jemput ya Kak, estimasi 3-5 menit lagi tiba dengan motor OZgo!';
      if (l.includes('siap') || l.includes('tunggu') || l.includes('depan')) return 'Oke siap Kak! Mohon tunggu sebentar di titik jemput, saya segera sampai.';
      return 'Siap Kak, pesan sudah saya terima. Saya sedang memproses pesanan Anda ya!';
    }

    function buildAdminReply(text) {
      const l = text.toLowerCase();
      if (l.includes('acc') || l.includes('aktif') || l.includes('daftar')) return 'Halo Mitra OZgo, tim Admin OZgo sedang memverifikasi data Anda. Mohon ditunggu ya.';
      return 'Pesan diterima oleh Admin OZgo. Ada kendala atau data yang perlu kami bantu perbarui?';
    }

    function sendOrderChat(orderId, text, senderRole) {
      const clean = text.trim();
      if (!clean) return;
      const order = state.orders.find((o) => o.orderId === orderId);
      if (!order || (!order.assignedDriverId && !order.assignedDriverName)) return;
      const drv = getActiveDriver();
      const senderName = senderRole === 'driver' ? (drv?.name || order.assignedDriverName || 'Driver OZgo') : (state.profile.name || order.customerName || 'Pelanggan OZgo');
      state.chats[orderId] = [...(state.chats[orderId] || []), { id: 'm_' + Date.now(), orderId, senderRole, senderName, text: clean, createdAtMs: Date.now() }];
      persistAll();
      renderModal(); render();
      if (senderRole === 'customer') {
        const replyDriver = order.assignedDriverName || 'Driver OZgo';
        setTimeout(() => {
          state.chats[orderId] = [...(state.chats[orderId] || []), { id: 'm_' + Date.now(), orderId, senderRole: 'driver', senderName: replyDriver, text: buildDriverReply(clean), createdAtMs: Date.now() }];
          if (state.activeChatOrderId !== orderId) state.unread[orderId] = (state.unread[orderId] || 0) + 1;
          persistAll();
          if (state.soundEnabled) playChatChime();
          showToast(`Pesan masuk dari ${replyDriver}`, 'info');
          renderModal(); render();
        }, 1100);
      }
    }

    function sendDriverAdminChat(driverId, text, senderRole) {
      const clean = text.trim();
      if (!clean) return;
      const drv = state.drivers.find((d) => d.uid === driverId);
      const senderName = senderRole === 'admin' ? 'Admin OZgo' : (drv?.name || 'Driver OZgo');
      state.driverAdminChats[driverId] = [...(state.driverAdminChats[driverId] || []), { id: 'da_' + Date.now(), driverId, senderRole, senderName, text: clean, createdAtMs: Date.now() }];
      persistAll();
      renderModal(); render();
      if (senderRole === 'driver') {
        setTimeout(() => {
          state.driverAdminChats[driverId] = [...(state.driverAdminChats[driverId] || []), { id: 'da_' + Date.now(), driverId, senderRole: 'admin', senderName: 'Admin OZgo', text: buildAdminReply(clean), createdAtMs: Date.now() }];
          if (state.activeDAChatDriverId !== driverId) state.unreadDA[driverId] = (state.unreadDA[driverId] || 0) + 1;
          persistAll();
          if (state.soundEnabled) playChatChime();
          showToast('Pesan masuk dari Admin OZgo', 'info');
          renderModal(); render();
        }, 1200);
      }
    }

    // ===== GPS SIM =====
    function stopGps() { if (state.gpsSimTimer) { clearInterval(state.gpsSimTimer); state.gpsSimTimer = null; } }
    function toggleGpsSim() {
      const drv = getActiveDriver();
      if (!drv || !drv.isOnline) return;
      if (state.gpsSimTimer) {
        stopGps(); showToast('Simulasi GPS dihentikan', 'info');
      } else {
        state.gpsSimTimer = setInterval(() => {
          const d = getActiveDriver();
          if (!d || !d.isOnline) { stopGps(); return; }
          d.lat = Number((d.lat + (Math.random() - 0.45) * 0.0005).toFixed(6));
          d.lng = Number((d.lng + (Math.random() - 0.45) * 0.0005).toFixed(6));
          d.speed = 24;
          persistAll(); render();
        }, 3000);
        showToast('Simulasi gerak GPS aktif', 'success');
      }
      render();
    }

                    <label class="inline-flex items-center gap-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 px-3 py-1.5 text-xs font-bold text-white cursor-pointer">

                  </form>
                `}
              </section>
            `}
            <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 overflow-hidden">
              <button type="button" id="btn-toggle-theme" class="flex w-full min-h-[52px] items-center justify-between px-4 text-sm font-medium cursor-pointer"><span>${state.isDark ? '☀️ Ganti ke Mode Terang' : '🌙 Ganti ke Mode Gelap'}</span><span class="text-xs text-slate-400">Ubah</span></button>
            </div>
          </div>
        `;
      }
      return subNav + body;
    }

    // ===== MAIN RENDER (STRICTLY ROLE-ISOLATED) =====
    function render() {
      const eff = getEffectivePortal();
      renderHeader();
      renderMobileNav();
      const root = document.getElementById('app-root');
      if (eff === 'customer') root.innerHTML = renderCustomer();
      else if (eff === 'auth') root.innerHTML = renderAuth();
      else if (eff === 'driver') root.innerHTML = renderDriver();
      else if (eff === 'admin') root.innerHTML = renderAdmin();

      if (eff === 'customer' && state.customerTab === 'beranda') {
        mountLeafletMap('customer-map', state.drivers.filter((d) => d.isOnline && d.approvalStatus === 'approved'));
      } else if (eff === 'driver') {
        const drv = getActiveDriver();
        if (drv) mountLeafletMap('driver-map', [drv]);
      } else if (eff === 'admin' && state.adminSection === 'map') {
        mountLeafletMap('admin-map', state.drivers);
      }
      renderPwaBanner();
      renderModal();
    }

    // ===== EVENT DELEGATION =====
    document.addEventListener('click', async (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;

      if (btn.dataset.navPortal) { state.portal = btn.dataset.navPortal; render(); return; }
      if (btn.dataset.openAuth) { state.portal = 'auth'; state.authTab = btn.dataset.openAuth; render(); return; }
      if (btn.dataset.ctab) { state.customerTab = btn.dataset.ctab; render(); return; }
      if (btn.dataset.pauthtab) { state.profileAuthTab = btn.dataset.pauthtab; render(); return; }
      if (btn.dataset.authusermode) { state.authUserMode = btn.dataset.authusermode; render(); return; }
      if (btn.dataset.modalusermode) { state.userLoginModalMode = btn.dataset.modalusermode; renderModal(); return; }
      if (btn.dataset.authtab) { state.authTab = btn.dataset.authtab; render(); return; }
      if (btn.dataset.ofilter) { state.orderFilter = btn.dataset.ofilter; render(); return; }
      if (btn.dataset.dfilter) { state.adminDriverFilter = btn.dataset.dfilter; render(); return; }
      if (btn.dataset.adminsec) { state.adminSection = btn.dataset.adminsec; render(); return; }
      if (btn.dataset.openService) {
        if (!isCustomerLoggedIn()) {
          state.userLoginModalService = btn.dataset.openService;
          state.userLoginModalMode = 'register';
          renderModal();
        } else {
          state.orderModalService = btn.dataset.openService;
          renderModal();
        }
        return;
      }
      if (btn.dataset.zoomDriver) {
        const d = state.drivers.find((x) => x.uid === btn.dataset.zoomDriver);
        state.zoomTarget = {
          kind: 'driver',
          name: d?.name || 'Mitra Driver OZgo',
          photoDataUrl: d?.photoDataUrl || '',
          phone: d?.phone || CONFIG.whatsappNumber,
          vehicleModel: d?.vehicleModel || 'Sepeda Motor OZgo',
          area: d?.area || 'Rangkasbitung',
          statusLabel: d ? (d.isOnline ? 'Online · Siap Menerima Pesanan' : 'Offline') : 'Mitra OZgo',
        };
        renderModal(); return;
      }
      if (btn.dataset.zoomCustomer) {
        const u = state.customers.find((c) => c.uid === btn.dataset.zoomCustomer);
        if (u) {
          state.zoomTarget = { kind: 'customer', name: u.name, photoDataUrl: u.photoDataUrl || '', phone: u.phone, address: u.address };
          renderModal();
        }
        return;
      }
      if (btn.dataset.zoomSelfUser) {
        state.zoomTarget = {
          kind: 'customer',
          name: state.profile.name || 'Pengguna OZgo',
          photoDataUrl: state.profile.photoDataUrl || '',
          phone: state.profile.phone || '-',
          address: state.profile.address || '-',
        };
        renderModal(); return;
      }
      if (btn.dataset.zoomOrderUser) {
        const o = state.orders.find((x) => x.orderId === btn.dataset.zoomOrderUser);
        if (o) {
          const cust = state.customers.find((c) => c.uid === o.customerId);
          state.zoomTarget = {
            kind: 'customer',
            name: o.customerName,
            photoDataUrl: o.customerPhotoUrl || cust?.photoDataUrl || '',
            phone: o.customerPhone || cust?.phone || '-',
            address: o.customerAddress || cust?.address || o.pickupAddress,
            serviceType: o.serviceType,
          };
          renderModal();
        }
        return;
      }
      if (btn.id === 'btn-driver-self-edit') {
        state.draftPhotos.editDriver = '';
        state.driverSelfEditOpen = true;
        renderModal(); return;
      }
      if (btn.id === 'btn-req-driver-notif') {
        if ('Notification' in window) {
          const p = await Notification.requestPermission();
          showToast(p === 'granted' ? 'Notifikasi sistem aktif!' : 'Izin notifikasi ditolak browser.', p === 'granted' ? 'success' : 'info');
          render();
        }
        return;
      }
      if (btn.id === 'btn-pwa-install-trigger' || btn.id === 'btn-pwa-banner-install') {
        if (state.pwaDeferredPrompt) {
          try {
            await state.pwaDeferredPrompt.prompt();
            const choice = await state.pwaDeferredPrompt.userChoice;
            if (choice && choice.outcome === 'accepted') {
              state.pwaInstalled = true;
              try { localStorage.setItem('ozgo_pwa_installed_v1', '1'); } catch {}
              showToast('Aplikasi OZgo berhasil dipasang di HP Anda!', 'success');
            }
          } catch {}
          state.pwaDeferredPrompt = null;
          render();
          return;
        }
        state.pwaInstallGuide = detectPwaPlatform().isIOS ? 'ios' : 'android';
        renderModal();
        return;
      }
      if (btn.id === 'btn-pwa-banner-dismiss') {
        state.pwaBannerDismissed = true;
        try { sessionStorage.setItem('ozgo_pwa_banner_dismissed_v1', '1'); } catch {}
        renderPwaBanner();
        return;
      }
      if (btn.dataset.closeModal) {
        if (state.pwaInstallGuide) { state.pwaInstallGuide = null; renderModal(); return; }
        if (state.zoomTarget) { state.zoomTarget = null; renderModal(); return; }
        state.orderModalService = null; state.userLoginModalService = null; state.ozbudemenOpen = false;
        state.activeChatOrderId = null; state.activeDAChatDriverId = null;
        state.editingCustomerUid = null; state.editingDriverUid = null;
        state.driverSelfEditOpen = false;
        state.confirmDelete = null;
        renderModal(); return;
      }
      if (btn.dataset.openChat) {
        state.activeChatOrderId = btn.dataset.openChat;
        state.activeChatRole = btn.dataset.chatRole || 'customer';
        state.unread[state.activeChatOrderId] = 0;
        render(); return;
      }
      if (btn.dataset.openDachat) {
        state.activeDAChatDriverId = btn.dataset.openDachat;
        state.activeDAChatRole = btn.dataset.darole || 'driver';
        state.unreadDA[state.activeDAChatDriverId] = 0;
        render(); return;
      }
      if (btn.dataset.toggleSound) {
        state.soundEnabled = !state.soundEnabled;
        localStorage.setItem('ozgo_gh_sound', state.soundEnabled ? 'on' : 'off');

      }
      if (btn.dataset.testSound) { playChatChime(); showToast('Suara notifikasi aktif', 'info'); return; }
      if (btn.dataset.selectOrderSound) {
        const sid = btn.dataset.selectOrderSound;
        if (DRIVER_ORDER_SOUNDS.some((s) => s.id === sid)) {
          state.orderSoundId = sid;
          persistAll();
          if (state.orderSoundEnabled) playOrderAlert(sid);
          const meta = DRIVER_ORDER_SOUNDS.find((s) => s.id === sid);
          showToast(`Suara pesanan dipilih: ${meta.label}`, 'success');
          render();
        }
        return;
      }
      if (btn.id === 'btn-toggle-order-sound') {
        state.orderSoundEnabled = !state.orderSoundEnabled;
        if (!state.orderSoundEnabled) stopOrderAlert();
        persistAll();
        showToast(state.orderSoundEnabled ? 'Suara notifikasi pesanan diaktifkan' : 'Suara notifikasi pesanan dimatikan', 'info');
        render(); return;
      }
      if (btn.id === 'btn-test-order-sound') {
        playOrderAlert(state.orderSoundId);
        const meta = DRIVER_ORDER_SOUNDS.find((s) => s.id === state.orderSoundId);
        showToast(`Memutar: ${meta?.label || 'Alarm Order OZgo'}`, 'info');
        return;
      }
      if (btn.id === 'btn-stop-order-sound') {
        stopOrderAlert();
        showToast('Suara notifikasi dihentikan', 'info');
        return;
      }
      if (btn.dataset.demoDriver) {
        state.isSuperAdmin = false;
        state.activeDriverUid = btn.dataset.demoDriver;
        state.driverLoginErr = '';
        state.portal = 'driver';
        persistAll();
        showToast('Masuk sebagai Mitra Driver OZgo', 'success');
        render(); return;
      }
      if (btn.dataset.driverStatus) {
        const d = state.drivers.find((x) => x.uid === btn.dataset.driverStatus);
        if (d) {
          d.approvalStatus = btn.dataset.status;
          if (d.approvalStatus !== 'approved') d.isOnline = false;
          persistAll();
          showToast(`Status ${d.name} diperbarui menjadi ${d.approvalStatus.toUpperCase()}`, 'success');
          render();
        }
        return;
      }
      if (btn.dataset.editCustomer) { state.editingCustomerUid = btn.dataset.editCustomer; renderModal(); return; }
      if (btn.dataset.editDriver) { state.editingDriverUid = btn.dataset.editDriver; renderModal(); return; }
      if (btn.dataset.deleteCustomer) {
        const u = state.customers.find((c) => c.uid === btn.dataset.deleteCustomer);
        if (u) { state.confirmDelete = { kind: 'customer', uid: u.uid, name: u.name }; renderModal(); }
        return;
      }
      if (btn.dataset.deleteDriver) {
        const d = state.drivers.find((x) => x.uid === btn.dataset.deleteDriver);
        if (d && d.uid !== CONFIG.superAdminDriverUid) { state.confirmDelete = { kind: 'driver', uid: d.uid, name: d.name }; renderModal(); }
        return;
      }
      if (btn.id === 'btn-confirm-delete' && state.confirmDelete) {
        const { kind, uid, name } = state.confirmDelete;
        state.confirmDelete = null;
        if (kind === 'customer') {
          state.customers = state.customers.filter((c) => c.uid !== uid);
          if (state.profile.uid === uid) state.profile = { uid: '', name: '', phone: '', address: '' };
          persistAll(); showToast(`User ${name} berhasil dihapus`, 'info'); render();
          if (fbDb && fbAuth?.currentUser) { deleteDoc(doc(fbDb, 'users', uid)).catch(() => {}); }
        } else if (kind === 'driver' && uid !== CONFIG.superAdminDriverUid) {
          state.drivers = state.drivers.filter((d) => d.uid !== uid);
          if (state.activeDriverUid === uid) state.activeDriverUid = null;
          persistAll(); showToast(`Driver ${name} berhasil dihapus`, 'info'); render();
          if (fbDb && fbAuth?.currentUser) {
            deleteDoc(doc(fbDb, 'drivers', uid)).catch(() => {});
            deleteDoc(doc(fbDb, 'driver_locations', uid)).catch(() => {});
          }
        }
        return;
      }
      if (btn.dataset.acceptOrder) {
        const drv = getActiveDriver();
        const o = state.orders.find((x) => x.orderId === btn.dataset.acceptOrder);
        if (drv && o) {
          stopOrderAlert();
          o.status = 'assigned';
          o.offerStatus = 'accepted';
          o.offerExpiresAtMs = 0;
          o.assignedDriverId = drv.uid;
          o.assignedDriverName = drv.name;
          o.driverPhotoUrl = drv.photoDataUrl || '';
          persistAll(); showToast(`Pesanan #${o.orderId} diterima!`, 'success'); render();
        }
        return;
      }
      if (btn.dataset.declineOrder) {
        const o = state.orders.find((x) => x.orderId === btn.dataset.declineOrder);
        if (o) {
          stopOrderAlert();
          reassignOrderCascade(o, 'Driver menolak pesanan.');
          render();
        }
        return;
      }
      if (btn.dataset.completeOrder) {
        const o = state.orders.find((x) => x.orderId === btn.dataset.completeOrder);
        if (o) { o.status = 'completed'; persistAll(); showToast(`Pesanan #${o.orderId} selesai`, 'success'); render(); }
        return;
      }

      if (btn.id === 'btn-ozbudemen') { state.ozbudemenOpen = true; renderModal(); return; }
      if (btn.id === 'btn-wa-ozbudemen') { openWA('Halo Admin OZgo, saya ingin daftar OZbudemen (Prioritas Warga Mabu).'); return; }
      if (btn.id === 'btn-toggle-theme') {
        state.isDark = !state.isDark;
        document.documentElement.classList.toggle('dark', state.isDark);
        localStorage.setItem('ozgo_gh_theme', state.isDark ? 'dark' : 'light');
        render(); return;
      }
      if (btn.id === 'btn-user-switch') {
        state.profile = { uid: '', name: '', phone: '', address: '', photoDataUrl: '' };
        persistAll(); showToast('Anda telah logout dari akun User OZgo.', 'info'); render(); return;
      }
      if (btn.id === 'btn-admin-bio-login') {
        const res = await loginRealFingerprint();
        if (res.ok) {
          state.isSuperAdmin = true; state.activeDriverUid = CONFIG.superAdminDriverUid; state.portal = 'admin'; state.adminPwdVerified = false; state.adminBioErr = '';
          showToast('Sidik jari terverifikasi! Selamat datang Super Admin OZgo.', 'success'); render();
        } else {
          state.adminBioErr = res.error || 'Verifikasi sidik jari gagal.'; state.adminBioIframeBlocked = Boolean(res.blockedByIframe);
          showToast(state.adminBioErr, 'error'); render();
        }
        return;
      }
      if (btn.id === 'btn-admin-bio-step2') {
        const res = state.adminBioCred ? await loginRealFingerprint() : await enrollRealFingerprint();
        if (res.ok) {
          state.isSuperAdmin = true; state.activeDriverUid = CONFIG.superAdminDriverUid; state.portal = 'admin'; state.adminPwdVerified = false; state.adminBioErr = '';
          showToast('Sidik jari asli terverifikasi! Selamat datang Super Admin OZgo.', 'success'); render();
        } else {
          state.adminBioErr = res.error || 'Gagal memproses sidik jari.'; state.adminBioIframeBlocked = Boolean(res.blockedByIframe);
          showToast(state.adminBioErr, 'error'); render();
        }
        return;
      }
      if (btn.id === 'btn-admin-pwd-fallback' && state.adminPwdVerified) {
        state.isSuperAdmin = true; state.activeDriverUid = CONFIG.superAdminDriverUid; state.portal = 'admin'; state.adminPwdVerified = false; state.adminBioErr = '';
        showToast('Login Super Admin OZgo berhasil.', 'success'); render(); return;
      }
      if (btn.id === 'btn-admin-back-pwd') {
        state.adminPwdVerified = false; state.adminBioErr = ''; state.adminBioIframeBlocked = false; render(); return;
      }
      if (btn.id === 'btn-admin-bio-enroll') {
        const res = await enrollRealFingerprint();
        showToast(res.ok ? 'Sidik jari asli perangkat berhasil didaftarkan!' : (res.error || 'Gagal mendaftarkan sidik jari.'), res.ok ? 'success' : 'error');
        render(); return;
      }
      if (btn.id === 'btn-admin-bio-reset') {
        localStorage.removeItem(WEBAUTHN_KEY); state.adminBioCred = null;
        showToast('Sidik jari perangkat ini dihapus.', 'info'); render(); return;
      }
      if (btn.id === 'btn-google-admin') {
        if (!fbAuth || !googleProvider) { showToast('Gunakan mode demo jika domain belum terdaftar di Firebase Auth', 'info'); return; }
        try {
          const res = await signInWithPopup(fbAuth, googleProvider);
          const isSA = (res.user.email || '').toLowerCase() === CONFIG.superAdminEmail.toLowerCase();
          if (!isSA) { showToast('Akun Google ini bukan Admin Utama OZgo.', 'error'); return; }
          state.isSuperAdmin = true;
          state.activeDriverUid = CONFIG.superAdminDriverUid;
          state.portal = 'admin';
          persistAll();
          render();
        } catch { showToast('Login Google dibatalkan atau domain belum diotorisasi', 'error'); }
        return;
      }
      if (btn.id === 'btn-logout-portal') {
        stopGps();
        stopOrderAlert();
        if (fbAuth) { try { await signOut(fbAuth); } catch {} }
        state.isSuperAdmin = false; state.activeDriverUid = null; state.portal = 'customer';
        persistAll();
        showToast('Berhasil keluar', 'info'); render(); return;
      }
      if (btn.id === 'btn-driver-online') {
        const drv = getActiveDriver();
        if (drv && drv.approvalStatus === 'approved') { drv.isOnline = true; persistAll(); showToast('Status Anda sekarang ONLINE', 'success'); render(); }
        return;
      }
      if (btn.id === 'btn-driver-offline') {
        const drv = getActiveDriver();
        if (drv) { drv.isOnline = false; stopGps(); persistAll(); showToast('Status Anda sekarang OFFLINE', 'info'); render(); }
        return;
      }
      if (btn.id === 'btn-gps-sim') { toggleGpsSim(); return; }
      if (btn.id === 'btn-copy-html-bottom') {
        const src = '<!doctype html>\n' + document.documentElement.outerHTML;
        try { await navigator.clipboard.writeText(src); } catch {}
        state.htmlCopied = true;
        showToast('Kode HTML berhasil disalin!', 'success');
        render();
        setTimeout(() => { state.htmlCopied = false; render(); }, 2500);
        return;
      }
      if (btn.id === 'btn-download-html-bottom') {
        const src = '<!doctype html>\n' + document.documentElement.outerHTML;
        const blob = new Blob([src], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = 'ozgo.html';
        document.body.appendChild(a); a.click(); a.remove();
        return;
      }
    });

    document.addEventListener('input', (e) => {
      if (e.target.id === 'svc-search') { state.searchQuery = e.target.value; render(); document.getElementById('svc-search')?.focus(); }
      if (e.target.id === 'admin-driver-search') { state.adminSearch = e.target.value; render(); document.getElementById('admin-driver-search')?.focus(); }
      if (e.target.id === 'admin-user-search') { state.adminUserSearch = e.target.value; render(); document.getElementById('admin-user-search')?.focus(); }
    });

    document.addEventListener('change', async (e) => {
      if (e.target.dataset.photoTarget) {
        const key = e.target.dataset.photoTarget;
        const file = e.target.files?.[0];
        if (!file) return;
        try {
          const dataUrl = await compressPhotoFile(file);
          state.draftPhotos[key] = dataUrl;
          showToast('Foto profil berhasil dimuat!', 'success');
          if (key === 'modalUser' || key === 'editDriver') renderModal();
          else render();
        } catch (err) {
          showToast(err?.message || 'Gagal memproses foto', 'error');
        }
        return;
      }
      if (e.target.dataset.assignOrder) {
        const o = state.orders.find((x) => x.orderId === e.target.dataset.assignOrder);
        const d = state.drivers.find((x) => x.uid === e.target.value);
        if (o && d) {
          o.assignedDriverId = d.uid; o.assignedDriverName = d.name; o.driverPhotoUrl = d.photoDataUrl || ''; o.status = 'assigned'; o.offerStatus = 'accepted'; o.offerExpiresAtMs = 0;
          persistAll(); showToast(`Pesanan #${o.orderId} ditugaskan ke ${d.name}`, 'success'); render();
        }
      }
    });

    document.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (e.target.id === 'admin-pwd-login-form') {
        const email = document.getElementById('adm-email').value.trim();
        const pass = document.getElementById('adm-pass').value;
        const ok = await verifyAdminCreds(email, pass);
        if (!ok) { state.adminBioErr = 'Email atau password Admin utama OZgo salah.'; showToast(state.adminBioErr, 'error'); render(); return; }
        state.adminBioErr = '';
        if (state.adminBioCred) {
          state.adminPwdVerified = true; render();
          const bio = await loginRealFingerprint();
          if (bio.ok) {
            state.isSuperAdmin = true; state.activeDriverUid = CONFIG.superAdminDriverUid; state.portal = 'admin'; state.adminPwdVerified = false;
            showToast('Sidik jari terverifikasi! Selamat datang Super Admin OZgo.', 'success'); render();
          } else {
            state.adminBioErr = bio.error || 'Verifikasi sidik jari gagal.'; state.adminBioIframeBlocked = Boolean(bio.blockedByIframe); render();
          }
          return;
        }
        if (state.bioSupport.supported) {
          state.adminPwdVerified = true;
          showToast('Email & Password benar. Daftarkan sidik jari asli Anda sekarang.', 'info');
          render(); return;
        }
        state.isSuperAdmin = true; state.activeDriverUid = CONFIG.superAdminDriverUid; state.portal = 'admin';
        showToast('Login Super Admin OZgo berhasil.', 'success'); render();
      } else if (e.target.id === 'user-reconnect-form' || e.target.id === 'auth-user-reconnect-form' || e.target.id === 'modal-user-reconnect-form') {
        const inputId = e.target.id === 'auth-user-reconnect-form' ? 'auth-urec-wa' : e.target.id === 'modal-user-reconnect-form' ? 'mod-urec-wa' : 'reconnect-wa';
        const wa = document.getElementById(inputId).value.trim();
        const norm = normalizeWA(wa);
        const found = state.customers.find((c) => normalizeWA(c.phone) === norm);
        if (!found) { showToast('No. WA belum terdaftar. Silakan isi data baru.', 'error'); return; }
        state.profile = { uid: found.uid, name: found.name, phone: found.phone, address: found.address, photoDataUrl: found.photoDataUrl || '' };
        const pendingSvc = state.userLoginModalService;
        state.userLoginModalService = null;
        state.portal = 'customer';
        if (pendingSvc) state.orderModalService = pendingSvc;
        persistAll(); showToast(`Selamat datang kembali, ${found.name}!`, 'success'); render();
      } else if (e.target.id === 'user-register-form' || e.target.id === 'auth-user-reg-form' || e.target.id === 'modal-user-reg-form') {
        const isAuth = e.target.id === 'auth-user-reg-form';
        const isMod = e.target.id === 'modal-user-reg-form';
        const name = document.getElementById(isAuth ? 'auth-u-name' : isMod ? 'mod-u-name' : 'reg-user-name').value.trim();
        const phone = document.getElementById(isAuth ? 'auth-u-wa' : isMod ? 'mod-u-wa' : 'reg-user-wa').value.trim();
        const address = document.getElementById(isAuth ? 'auth-u-addr' : isMod ? 'mod-u-addr' : 'reg-user-addr').value.trim();
        const photoKey = isAuth ? 'authUser' : isMod ? 'modalUser' : 'regUser';
        const photoDataUrl = state.draftPhotos[photoKey] || '';
        if (!name || !isValidWA(phone) || !address) { showToast('Lengkapi Nama Lengkap, No. WA valid, dan Alamat.', 'error'); return; }
        const norm = normalizeWA(phone);
        const existing = state.customers.find((c) => normalizeWA(c.phone) === norm);
        if (existing) {
          if (photoDataUrl) existing.photoDataUrl = photoDataUrl;
          existing.name = name; existing.address = address;
          state.profile = { uid: existing.uid, name: existing.name, phone: existing.phone, address: existing.address, photoDataUrl: existing.photoDataUrl || '' };
        } else {
          const created = { uid: 'usr_' + Date.now(), name, phone, normalizedPhone: norm, address, photoDataUrl, createdAtMs: Date.now() };
          state.customers = [created, ...state.customers];
          state.profile = { uid: created.uid, name, phone, address, photoDataUrl };
        }
        state.draftPhotos[photoKey] = '';
        const pendingSvc = state.userLoginModalService;
        state.userLoginModalService = null;
        state.portal = 'customer';
        if (pendingSvc) state.orderModalService = pendingSvc;
        persistAll(); showToast(`Login berhasil! Selamat datang, ${name}.`, 'success'); render();
      } else if (e.target.id === 'profile-edit-form') {
        const name = document.getElementById('edit-prof-name').value.trim();
        const phone = document.getElementById('edit-prof-phone').value.trim();
        const address = document.getElementById('edit-prof-address').value.trim();
        const photoDataUrl = state.draftPhotos.editUser || state.profile.photoDataUrl || '';
        if (!name || !isValidWA(phone) || !address) { showToast('Data profil belum valid', 'error'); return; }
        const norm = normalizeWA(phone);
        state.profile = { ...state.profile, name, phone, address, photoDataUrl };
        const idx = state.customers.findIndex((c) => c.uid === state.profile.uid);
        if (idx >= 0) state.customers[idx] = { ...state.customers[idx], name, phone, normalizedPhone: norm, address, photoDataUrl };
        state.draftPhotos.editUser = '';
        persistAll(); showToast('Data & foto profil user diperbarui', 'success'); render();
      } else if (e.target.id === 'driver-self-edit-form') {
        const drv = getActiveDriver();
        if (drv) {
          drv.name = document.getElementById('dself-name').value.trim();
          drv.phone = document.getElementById('dself-phone').value.trim();
          drv.vehicleModel = document.getElementById('dself-model').value.trim();
          drv.area = document.getElementById('dself-area').value.trim();
          if (state.draftPhotos.editDriver) drv.photoDataUrl = state.draftPhotos.editDriver;
          state.draftPhotos.editDriver = '';
          state.driverSelfEditOpen = false;
          persistAll(); showToast('Profil & foto driver diperbarui', 'success'); render();
        }
      } else if (e.target.id === 'driver-wa-login-form') {
        const rawPhone = document.getElementById('dlogin-wa').value.trim();
        if (!isValidWA(rawPhone)) {
          state.driverLoginErr = 'Masukkan Nomor WhatsApp driver yang valid (minimal 10 digit).';
          showToast(state.driverLoginErr, 'error'); render(); return;
        }
        const norm = normalizeWA(rawPhone);
        const found = state.drivers.find((d) => normalizeWA(d.phone) === norm);
        if (!found) {
          state.driverLoginErr = 'No. WA belum terdaftar sebagai Mitra Driver OZgo. Silakan daftar di tab Daftar Driver.';
          showToast(state.driverLoginErr, 'error'); render(); return;
        }
        if (found.uid === CONFIG.superAdminDriverUid) {
          state.driverLoginErr = 'Nomor ini terdaftar sebagai Admin Utama OZgo. Silakan masuk melalui tab Login Admin.';
          showToast(state.driverLoginErr, 'error'); render(); return;
        }
        state.driverLoginErr = '';
        state.isSuperAdmin = false;
        state.activeDriverUid = found.uid;
        state.portal = 'driver';
        persistAll();
        showToast(
          found.approvalStatus === 'pending'
            ? 'Pendaftaran anda sedang di proses admin OZgo'
            : `Selamat datang kembali, ${found.name}!`,
          found.approvalStatus === 'pending' ? 'info' : 'success'
        );
        render();
      } else if (e.target.id === 'driver-reg-form') {
        const name = document.getElementById('dreg-name').value.trim();
        const phone = document.getElementById('dreg-phone').value.trim();
        const rawEmail = document.getElementById('dreg-email').value.trim();
        const vehicleModel = document.getElementById('dreg-model').value.trim();
        const area = document.getElementById('dreg-area').value.trim();
        const photoDataUrl = state.draftPhotos.regDriver || '';
        if (!name || !isValidWA(phone) || !vehicleModel || !area) {
          showToast('Lengkapi Nama Lengkap, No. WA valid, Merk/Tipe Motor, dan Area Operasi.', 'error'); return;
        }
        const norm = normalizeWA(phone);
        const existing = state.drivers.find((d) => normalizeWA(d.phone) === norm && d.uid !== CONFIG.superAdminDriverUid);
        if (existing) {
          if (photoDataUrl) existing.photoDataUrl = photoDataUrl;
          state.draftPhotos.regDriver = '';
          state.isSuperAdmin = false;
          state.activeDriverUid = existing.uid;
          state.portal = 'driver';
          persistAll();
          showToast(`No. WA sudah terdaftar sebagai driver ${existing.name}. Langsung masuk ke Portal Driver!`, 'success');
          render(); return;
        }
        const email = rawEmail || `driver.${norm}@ozgo.id`;
        const newDrv = {
          uid: 'drv_' + Date.now(), name, email, phone, vehicleType: 'motor', vehicleModel, area, photoDataUrl,
          approvalStatus: 'pending', isOnline: false, lat: CONFIG.center.lat + 0.002, lng: CONFIG.center.lng + 0.002, speed: 0,
        };
        state.drivers = [newDrv, ...state.drivers];
        seenPendingDriverIds.add(newDrv.uid);
        state.draftPhotos.regDriver = '';
        state.isSuperAdmin = false;
        state.activeDriverUid = newDrv.uid;
        state.portal = 'driver';
        persistAll();
        if (fbDb) {
          setDoc(doc(fbDb, 'driver_applications', newDrv.uid), {
            uid: newDrv.uid, name: newDrv.name, email: newDrv.email, phone: newDrv.phone, normalizedPhone: norm,
            vehicleType: 'motor', vehicleModel: newDrv.vehicleModel, area: newDrv.area,
            approvalStatus: 'pending', createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
          }).catch(() => {});
          setDoc(doc(fbDb, 'driver_status', norm), {
            uid: newDrv.uid, name: newDrv.name, vehicleModel: newDrv.vehicleModel, area: newDrv.area,
            approvalStatus: 'pending', updatedAt: serverTimestamp(),
          }).catch(() => {});
        }
        if (state.soundEnabled) playChatChime();
        showToast('Pendaftaran terkirim ke Admin OZgo! Klik tombol WA Admin untuk mempercepat ACC.', 'info');
        render();
      } else if (e.target.id === 'order-submit-form') {
        const svc = state.orderModalService;
        const customerName = document.getElementById('ord-name').value.trim();
        const pickup = document.getElementById('ord-pickup').value.trim();
        const dropoff = document.getElementById('ord-dropoff').value.trim();
        const paymentMethod = document.getElementById('ord-pay').value;
        const details = (document.getElementById('ord-details')?.value || '').trim();
        const notes = (document.getElementById('ord-notes')?.value || '').trim();
        const itemType = (document.getElementById('ord-item-type')?.value || '').trim();
        const recvName = (document.getElementById('ord-recv-name')?.value || '').trim();
        const recvPhone = (document.getElementById('ord-recv-phone')?.value || '').trim();
        let summary = `${pickup} → ${dropoff}`;
        if (svc === 'OZFood' && details) summary = `${pickup} (${details}) → ${dropoff}`;
        else if (svc === 'OZSend') summary = `[${itemType || 'Paket'}] ${pickup} → ${recvName || dropoff}${recvPhone ? ` (${recvPhone})` : ''}`;
        else if (svc === 'OZMart' && details) summary = `${pickup} [${itemType || 'Belanja'}]: ${details} → ${dropoff}`;
        const match = findNearestDriver(CONFIG.center.lat, CONFIG.center.lng, []);
        const nearest = match?.driver || null;
        const isRegularOffer = Boolean(match && !match.isAdminFallback);
        const orderId = 'OZ-' + svc.slice(2, 3) + Math.floor(10000 + Math.random() * 89999);
        const newOrder = {
          orderId, serviceType: svc,
          customerId: state.profile.uid || '',
          customerName,
          customerPhone: state.profile.phone || '',
          customerAddress: state.profile.address || pickup,
          customerPhotoUrl: state.profile.photoDataUrl || '',
          driverPhotoUrl: nearest?.photoDataUrl || '',
          pickupAddress: pickup, dropoffAddress: dropoff,
          summary, paymentMethod, notes: details || notes,
          status: isRegularOffer ? 'pending' : (nearest ? 'assigned' : 'pending'),
          offerStatus: isRegularOffer ? 'offering' : 'escalated_admin',
          offerExpiresAtMs: isRegularOffer ? (Date.now() + ORDER_OFFER_TIMEOUT_MS) : 0,
          declinedDriverIds: [],
          assignedDriverId: nearest ? nearest.uid : null,
          assignedDriverName: nearest ? nearest.name : null,
          createdAtMs: Date.now(),
        };
        state.orders = [newOrder, ...state.orders];
        state.orderModalService = null;
        state.customerTab = 'pesanan';
        persistAll();
        if (state.orderSoundEnabled && nearest && state.activeDriverUid === nearest.uid) {
          playOrderAlert(state.orderSoundId);
          notifyDriverOS(newOrder);
        }
        showToast(
          isRegularOffer
            ? `Pesanan #${orderId} ditawarkan ke driver terdekat: ${nearest.name} (batas 40 detik)`
            : nearest
              ? `Pesanan #${orderId} otomatis masuk ke ${nearest.name}`
              : `Pesanan #${orderId} berhasil dibuat`,
          'success'
        );
        render();
      } else if (e.target.id === 'order-chat-form') {
        const inp = document.getElementById('order-chat-input');
        sendOrderChat(state.activeChatOrderId, inp.value, state.activeChatRole);
      } else if (e.target.id === 'da-chat-form') {
        const inp = document.getElementById('da-chat-input');
        sendDriverAdminChat(state.activeDAChatDriverId, inp.value, state.activeDAChatRole);
      } else if (e.target.id === 'admin-edit-user-form') {
        const u = state.customers.find((c) => c.uid === state.editingCustomerUid);
        if (u) {
          u.name = document.getElementById('aeu-name').value.trim();
          u.phone = document.getElementById('aeu-phone').value.trim();
          u.normalizedPhone = normalizeWA(u.phone);
          u.address = document.getElementById('aeu-addr').value.trim();
          if (state.profile.uid === u.uid) state.profile = { uid: u.uid, name: u.name, phone: u.phone, address: u.address };
          state.editingCustomerUid = null;
          persistAll(); showToast(`Data user ${u.name} berhasil diubah`, 'success'); render();
        }
      } else if (e.target.id === 'admin-edit-driver-form') {
        const d = state.drivers.find((x) => x.uid === state.editingDriverUid);
        if (d) {
          d.name = document.getElementById('aed-name').value.trim();
          d.phone = document.getElementById('aed-phone').value.trim();
          d.vehicleModel = document.getElementById('aed-model').value.trim();
          d.area = document.getElementById('aed-area').value.trim();
          state.editingDriverUid = null;
          persistAll(); showToast(`Data driver ${d.name} berhasil diubah`, 'success'); render();
        }
      }
    });

    render();
  </script>
</body>
</html>

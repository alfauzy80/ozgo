    // ===== AUDIO NOTIFIKASI CHAT (WEB AUDIO API) =====
    let audioCtx = null;
    function playChatChime() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const notes = [{ f: 880, t: 0, d: 0.14 }, { f: 1174.66, t: 0.13, d: 0.22 }];
        notes.forEach(({ f, t, d }) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(f, now + t);
          gain.gain.setValueAtTime(0.0001, now + t);
          gain.gain.exponentialRampToValueAtTime(0.18, now + t + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + t + d);
          osc.connect(gain); gain.connect(audioCtx.destination);
          osc.start(now + t); osc.stop(now + t + d + 0.02);
        });
      } catch {}
    }

        const icon = L.divIcon({
          className: '',
          html: `<div class="ozgo-pin" style="background:${d.isOnline ? '#059669' : '#64748b'}">🏍️</div>`,
          iconSize: [34, 34], iconAnchor: [17, 17],
        });
        L.marker([d.lat, d.lng], { icon })
          .addTo(activeMap)
          .bindPopup(`<b>${esc(d.name)}</b><br/>${esc(d.vehicleModel)}<br/><span style="color:${d.isOnline ? '#059669' : '#64748b'};font-weight:700">${d.isOnline ? 'ONLINE' : 'OFFLINE'}</span> · ${d.speed || 0} km/j<br/><small>${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}</small>`);
      });
    }

    // ===== CHAT & AUTO-REPLY =====
    function buildDriverReply(text) {
      const l = text.toLowerCase();
      if (l.includes('mana') || l.includes('posisi') || l.includes('sampai')) return 'Saya sedang meluncur ke titik jemput ya Kak, estimasi 3-5 menit lagi tiba dengan motor OZgo!';
      if (l.includes('siap') || l.includes('tunggu') || l.includes('depan')) return 'Oke siap Kak! Mohon tunggu sebentar di titik jemput, saya segera sampai.';
      if (l.includes('makasih') || l.includes('terima kasih')) return 'Sama-sama Kak! Terima kasih sudah menggunakan OZgo.';
      return 'Siap Kak, pesan sudah saya terima. Saya sedang memproses pesanan Anda ya!';
    }

    function sendChatMessage(orderId, text, senderRole) {
      const clean = text.trim();
      if (!clean) return;
      const order = state.orders.find((o) => o.orderId === orderId);
      const drv = getActiveDriver();
      const senderName = senderRole === 'driver' ? (drv?.name || order?.assignedDriverName || 'Driver OZgo') : (state.profile.name || order?.customerName || 'Pelanggan OZgo');
      const msg = { id: 'm_' + Date.now(), orderId, senderRole, senderName, text: clean, createdAtMs: Date.now() };
      state.chats[orderId] = [...(state.chats[orderId] || []), msg];
      persistAll();
      renderModal();
      render();

      if (senderRole === 'customer') {
        const replyDriver = order?.assignedDriverName || 'Hendra Wijaya';
        setTimeout(() => {
          const reply = { id: 'm_' + Date.now(), orderId, senderRole: 'driver', senderName: replyDriver, text: buildDriverReply(clean), createdAtMs: Date.now() };
          state.chats[orderId] = [...(state.chats[orderId] || []), reply];
          if (state.activeChatOrderId !== orderId) state.unread[orderId] = (state.unread[orderId] || 0) + 1;
          persistAll();
          if (state.soundEnabled) playChatChime();
          showToast(`Pesan masuk dari ${replyDriver}`, 'info');
          renderModal();
          render();
        }, 1200);
      }
    }

    // ===== GPS DRIVER =====
    function stopGps() {
      if (state.gpsSimTimer) { clearInterval(state.gpsSimTimer); state.gpsSimTimer = null; }
      if (state.gpsWatchId !== null && navigator.geolocation) { navigator.geolocation.clearWatch(state.gpsWatchId); state.gpsWatchId = null; }
    }
    function toggleGpsSim() {
      const drv = getActiveDriver();
      if (!drv || !drv.isOnline) return;
      if (state.gpsSimTimer) {
        clearInterval(state.gpsSimTimer); state.gpsSimTimer = null;
        showToast('Simulasi gerak GPS dihentikan', 'info');
      } else {
        state.gpsSimTimer = setInterval(() => {
          const d = getActiveDriver();
          if (!d || !d.isOnline) { stopGps(); return; }
          d.lat = Number((d.lat + (Math.random() - 0.45) * 0.0005).toFixed(6));
          d.lng = Number((d.lng + (Math.random() - 0.45) * 0.0005).toFixed(6));
          d.speed = 24;
          persistAll();
          render();
        }, 3000);
        showToast('Simulasi gerak GPS aktif (update tiap 3 detik)', 'success');
      }
      render();
    }

    function renderDriver() {

      const isOnline = drv.isOnline && isApproved;
      const myOrders = state.orders.filter((o) => o.assignedDriverId === drv.uid);

      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-5">

              <h1 class="text-xl font-bold">🏍️ ${esc(drv.name)}</h1>

            <div class="flex flex-wrap gap-2">

              <button type="button" id="btn-logout" class="min-h-[42px] rounded-xl border border-slate-200 dark:border-slate-700 px-3.5 text-xs font-semibold text-red-500 cursor-pointer">Keluar</button>

            <div class="rounded-2xl border border-amber-500/40 bg-amber-50 dark:bg-amber-950/30 p-4 text-xs text-amber-800 dark:text-amber-200">
              <strong>${drv.approvalStatus === 'pending' ? 'Akun Menunggu Verifikasi Tim OZgo' : 'Akun Sedang Dinonaktifkan'}</strong> — Menu Online &amp; pelacakan GPS otomatis terbuka setelah pendaftaran mitra motor Anda disetujui.
            </div>
          ` : ''}

              <section class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-5 space-y-4">

                  <h2 class="text-sm font-bold">Status Kerja Driver</h2>
                  <p class="mt-0.5 text-xs font-semibold ${isOnline ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500'}">${isOnline ? 'SEDANG ONLINE — Menerima Order & GPS Aktif' : 'SEDANG OFFLINE — Istirahat & GPS Nonaktif'}</p>

                <div class="grid grid-cols-2 gap-2.5">
                  <button type="button" id="btn-go-online" ${!isApproved || isOnline ? 'disabled' : ''} class="min-h-[48px] rounded-xl text-sm font-bold cursor-pointer ${isOnline ? 'bg-emerald-600 text-white' : 'border border-emerald-500/40 bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 disabled:opacity-45'}">Aktifkan Online</button>
                  <button type="button" id="btn-go-offline" ${!isOnline ? 'disabled' : ''} class="min-h-[48px] rounded-xl text-sm font-bold cursor-pointer ${!isOnline ? 'bg-slate-800 text-white' : 'border border-slate-300 dark:border-slate-700'}">Mode Offline</button>
                </div>
                <div class="grid grid-cols-3 gap-2 border-t border-slate-200 dark:border-slate-800 pt-3 font-mono text-xs">
                  <div><span class="block font-sans text-[11px] text-slate-500">Latitude</span>${drv.lat.toFixed(5)}</div>
                  <div><span class="block font-sans text-[11px] text-slate-500">Longitude</span>${drv.lng.toFixed(5)}</div>
                  <div><span class="block font-sans text-[11px] text-slate-500">Kecepatan</span>${drv.speed || 0} km/j</div>

                    <p class="text-slate-500">Jemput: ${esc(o.pickupAddress)}</p>

                      ${o.status === 'assigned' ? `<button type="button" data-order-status="${esc(o.orderId)}:in_progress" class="flex-1 min-h-[40px] rounded-xl bg-blue-600 text-xs font-bold text-white cursor-pointer">Mulai Pengantaran</button>` : ''}
                      ${o.status === 'in_progress' ? `<button type="button" data-order-status="${esc(o.orderId)}:completed" class="flex-1 min-h-[40px] rounded-xl bg-emerald-600 text-xs font-bold text-white cursor-pointer">Selesaikan Order</button>` : ''}
                    </div>
                  </div>
                `).join('')}
              </section>
            </div>
            <div class="lg:col-span-7 space-y-3">
              <h2 class="text-sm font-bold">Peta Pelacakan Lokasi Driver (Real-Time)</h2>
              <div id="driver-map" class="h-[380px] lg:h-[500px] w-full rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"></div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAdmin() {
      const online = state.drivers.filter((d) => d.isOnline && d.approvalStatus === 'approved');
      const pending = state.drivers.filter((d) => d.approvalStatus === 'pending');
      const activeOrders = state.orders.filter((o) => o.status !== 'completed' && o.status !== 'cancelled');
      const filtered = state.drivers.filter((d) => {
        if (state.adminDriverFilter === 'online' && !d.isOnline) return false;
        if (state.adminDriverFilter === 'offline' && d.isOnline) return false;
        if (state.adminDriverFilter === 'pending' && d.approvalStatus !== 'pending') return false;
        const q = state.adminSearch.trim().toLowerCase();
        return !q || d.name.toLowerCase().includes(q) || d.vehicleModel.toLowerCase().includes(q) || d.area.toLowerCase().includes(q);
      });

      return `
        <div class="space-y-6">
          <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 dark:border-slate-800 pb-5">
            <div>
              <h1 class="text-xl sm:text-2xl font-bold">Konsol Super Admin OZgo</h1>
              <p class="text-xs text-slate-500">Pemantauan Peta Real-Time · Verifikasi Mitra Motor · Dispatch Pesanan</p>
            </div>
            <div class="flex gap-2">
              <button type="button" data-nav-portal="driver" class="min-h-[42px] rounded-xl bg-emerald-600 hover:bg-emerald-700 px-4 text-xs font-bold text-white cursor-pointer">🏍️ Mode Driver OZgo</button>
              <button type="button" id="btn-logout" class="min-h-[42px] rounded-xl border border-slate-200 dark:border-slate-700 px-4 text-xs font-semibold text-red-500 cursor-pointer">Keluar Admin</button>
            </div>
          </div>
          <div class="grid grid-cols-2 lg:grid-cols-4 gap-3.5">
            <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4"><p class="text-xs text-slate-500">Total Mitra Motor</p><p class="mt-1 text-2xl font-bold font-mono">${state.drivers.length}</p></div>
            <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4"><p class="text-xs text-slate-500">Driver Online</p><p class="mt-1 text-2xl font-bold font-mono text-emerald-500">${online.length}</p></div>
            <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4"><p class="text-xs text-slate-500">Menunggu Verifikasi</p><p class="mt-1 text-2xl font-bold font-mono text-amber-500">${pending.length}</p></div>
            <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4"><p class="text-xs text-slate-500">Pesanan Aktif</p><p class="mt-1 text-2xl font-bold font-mono text-blue-500">${activeOrders.length}</p></div>
          </div>
          <div class="flex flex-wrap items-center justify-between gap-3">
            <div class="inline-flex rounded-xl bg-slate-100 dark:bg-slate-900 p-1 gap-1">
              ${[['map','Peta Real-Time'],['drivers',`Manajemen Driver (${state.drivers.length})`],['orders',`Pesanan (${state.orders.length})`]].map(([id,l]) => `<button type="button" data-asec="${id}" class="min-h-[40px] rounded-lg px-3.5 text-xs font-semibold cursor-pointer ${state.adminSection === id ? 'bg-white dark:bg-slate-800 text-emerald-600 dark:text-emerald-400 shadow-xs' : 'text-slate-500'}">${l}</button>`).join('')}
            </div>
            ${state.adminSection !== 'orders' ? `<div class="flex flex-wrap gap-1.5">${['all','online','offline','pending'].map((f) => `<button type="button" data-adfilter="${f}" class="min-h-[38px] rounded-xl px-3 text-xs font-semibold cursor-pointer ${state.adminDriverFilter === f ? 'bg-emerald-600 text-white' : 'border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900'}">${f.toUpperCase()}</button>`).join('')}</div>` : ''}
          </div>
          ${state.adminSection === 'map' ? `
            <div id="admin-map" class="h-[460px] w-full rounded-2xl border border-slate-200 dark:border-slate-800 overflow-hidden"></div>
          ` : state.adminSection === 'drivers' ? `
            <div class="overflow-x-auto rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
              <table class="w-full text-left text-xs sm:text-sm">
                <thead class="border-b border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 text-xs text-slate-500">
                  <tr><th class="px-4 py-3">Mitra Driver</th><th class="px-4 py-3">Kendaraan (Roda Dua)</th><th class="px-4 py-3">Area &amp; Kontak</th><th class="px-4 py-3">Status</th><th class="px-4 py-3 text-right">Tindakan</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
                  ${filtered.map((d) => {
                    const isOwner = d.email.toLowerCase() === CONFIG.superAdminEmail.toLowerCase();
                    return `<tr>
                      <td class="px-4 py-3"><p class="font-semibold">${esc(d.name)} ${isOwner ? '<span class="text-[10px] text-emerald-500">(Super Admin + Driver)</span>' : ''}</p><p class="text-xs text-slate-500">${esc(d.email)}</p></td>
                      <td class="px-4 py-3"><p class="font-semibold">${esc(d.vehicleModel)}</p><p class="text-xs text-slate-500">Sepeda Motor</p></td>
                      <td class="px-4 py-3"><p>${esc(d.area)}</p><p class="font-mono text-xs text-slate-500">${esc(d.phone)}</p></td>
                      <td class="px-4 py-3"><p class="font-bold ${d.approvalStatus === 'approved' ? 'text-emerald-500' : d.approvalStatus === 'pending' ? 'text-amber-500' : 'text-red-500'}">${d.approvalStatus}</p><p class="text-xs text-slate-500">${d.isOnline ? 'Online' : 'Offline'}</p></td>
                      <td class="px-4 py-3 text-right space-x-1">
                        ${d.approvalStatus !== 'approved' ? `<button type="button" data-approve="${esc(d.uid)}" class="rounded-lg bg-emerald-600 px-2.5 py-1.5 text-xs font-semibold text-white cursor-pointer">Setujui</button>` : ''}
                        ${d.isOnline ? `<button type="button" data-force-off="${esc(d.uid)}" class="rounded-lg border border-slate-300 dark:border-slate-700 px-2.5 py-1.5 text-xs font-semibold cursor-pointer">Offline</button>` : ''}
                        ${!isOwner && d.approvalStatus !== 'suspended' ? `<button type="button" data-suspend="${esc(d.uid)}" class="rounded-lg border border-red-500/30 px-2.5 py-1.5 text-xs font-semibold text-red-500 cursor-pointer">Nonaktifkan</button>` : ''}
                      </td>
                    </tr>`;
                  }).join('')}
                </tbody>
              </table>
            </div>
          ` : `
            <div class="space-y-3">
              ${state.orders.map((o) => `
                <div class="rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-4 flex flex-wrap items-center justify-between gap-3">

                    <p class="text-xs"><strong class="text-emerald-500">${esc(o.serviceType)}</strong> · #${esc(o.orderId)} · <span class="text-amber-500 font-semibold">${statusLabel(o.status)}</span></p>
                    <p class="text-sm font-bold">${esc(o.customerName)} — ${esc(o.summary)}</p>

                  </div>
                  <div class="flex gap-2">
                    ${o.status === 'pending' ? `<select data-assign-order="${esc(o.orderId)}" class="min-h-[40px] rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-950 px-3 text-xs"><option value="">Tugaskan Driver...</option>${online.map((d) => `<option value="${esc(d.uid)}">${esc(d.name)} (${esc(d.vehicleModel)})</option>`).join('')}</select>` : ''}
                    ${o.status !== 'completed' ? `<button type="button" data-order-status="${esc(o.orderId)}:completed" class="min-h-[40px] rounded-xl bg-emerald-600 px-3.5 text-xs font-bold text-white cursor-pointer">Tandai Selesai</button>` : ''}
                  </div>
                </div>
              `).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderModal() {
      const root = document.getElementById('modal-root');
      if (state.activeChatOrderId) {
        const order = state.orders.find((o) => o.orderId === state.activeChatOrderId);
        if (!order) { root.innerHTML = ''; return; }
        const msgs = state.chats[order.orderId] || [];
        const isCust = state.activeChatRole === 'customer';
        const quicks = isCust
          ? ['Halo Kak, posisi sudah sampai mana?', 'Saya sudah siap di titik jemput ya.', 'Terima kasih Kak!']
          : ['Siap Kak, saya sedang menuju titik jemput.', 'Saya sudah sampai di depan titik jemput ya.'];

        root.innerHTML = `
          <div role="dialog" aria-modal="true" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/75 p-0 sm:p-4">
            <div class="flex h-[85vh] sm:h-[620px] w-full max-w-lg flex-col overflow-hidden rounded-t-3xl sm:rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 shadow-2xl">
              <div class="flex items-center justify-between gap-2 border-b border-slate-200 dark:border-slate-800 px-4 py-3.5">
                <div class="min-w-0">
                  <h2 class="text-sm font-bold truncate">${isCust ? `🏍️ Driver ${esc(order.assignedDriverName || 'OZgo')}` : `👤 ${esc(order.customerName)}`}</h2>
                  <p class="text-[11px] text-slate-500 truncate">${esc(order.serviceType)} · #${esc(order.orderId)} · ${statusLabel(order.status)}</p>
                </div>
                <div class="flex items-center gap-1.5 shrink-0">
                  <button type="button" data-toggle-sound="1" class="h-9 w-9 rounded-xl border border-slate-200 dark:border-slate-700 text-xs cursor-pointer" title="Suara notifikasi">${state.soundEnabled ? '🔔' : '🔕'}</button>
                  <button type="button" data-test-sound="1" class="h-9 w-9 rounded-xl border border-slate-200 dark:border-slate-700 text-xs cursor-pointer" title="Tes suara">🔊</button>
                  <button type="button" id="btn-close-modal" class="h-9 w-9 rounded-xl text-slate-400 hover:text-white cursor-pointer">✕</button>
                </div>
              </div>
              <div class="bg-slate-50 dark:bg-slate-900/70 border-b border-slate-200 dark:border-slate-800 px-4 py-2 text-[11px] text-slate-500 flex justify-between">
                <span class="truncate">${esc(order.summary)}</span><strong class="text-emerald-500 ml-2">${esc(order.paymentMethod)}</strong>
              </div>
              <div id="chat-scroll" class="flex-1 overflow-y-auto px-4 py-4 space-y-3">
                ${msgs.length === 0 ? `<p class="text-center text-xs text-slate-500 py-8">Mulai percakapan untuk koordinasi titik jemput &amp; pesanan.</p>` : msgs.map((m) => {
                  const mine = m.senderRole === state.activeChatRole;
                  return `<div class="flex flex-col ${mine ? 'items-end' : 'items-start'}">
                    <span class="mb-1 text-[10px] text-slate-400">${mine ? 'Anda' : esc(m.senderName)} · ${fmtTime(m.createdAtMs)}</span>
                    <div class="max-w-[82%] rounded-2xl px-3.5 py-2.5 text-xs sm:text-sm ${mine ? 'bg-emerald-600 text-white rounded-br-sm' : 'bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-bl-sm'}">${esc(m.text)}</div>
                  </div>`;
                }).join('')}
              </div>
              <div class="flex gap-1.5 overflow-x-auto border-t border-slate-200 dark:border-slate-800 px-4 py-2">
                ${quicks.map((q) => `<button type="button" data-quick-chat="${esc(q)}" class="shrink-0 rounded-full border border-slate-200 dark:border-slate-700 px-3 py-1 text-[11px] font-medium hover:border-emerald-500 cursor-pointer">${esc(q)}</button>`).join('')}
              </div>
              <form id="chat-send-form" class="flex items-center gap-2 border-t border-slate-200 dark:border-slate-800 px-4 py-3">
                <input id="chat-input" type="text" placeholder="Tulis pesan..." autocomplete="off" class="flex-1 min-h-[44px] rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3.5 text-sm focus:border-emerald-500 focus:outline-none" />
                <button type="submit" class="min-h-[44px] rounded-xl bg-emerald-600 hover:bg-emerald-700 px-4 text-xs font-bold text-white cursor-pointer">Kirim</button>
              </form>
            </div>
          </div>
        `;
        const box = document.getElementById('chat-scroll');
        if (box) box.scrollTop = box.scrollHeight;
        return;
      }

      if (state.orderModalService) {
        const svc = state.orderModalService;
        root.innerHTML = `
          <div role="dialog" aria-modal="true" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center bg-slate-950/75 p-0 sm:p-4">
            <form id="order-create-form" class="w-full max-w-lg rounded-t-3xl sm:rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 p-5 space-y-3.5 shadow-2xl">
              <div class="flex items-center justify-between"><h2 class="text-base font-bold text-emerald-500">Pesan ${esc(svc)}</h2><button type="button" id="btn-close-modal" class="h-9 w-9 rounded-xl text-slate-400 cursor-pointer">✕</button></div>
              <div><label class="block text-xs font-semibold mb-1">Nama Pemesan</label><input name="customerName" required value="${esc(state.profile.name)}" placeholder="Nama Anda" class="w-full min-h-[42px] rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 text-sm" /></div>
              <div><label class="block text-xs font-semibold mb-1">${svc === 'OZFood' ? 'Nama Resto / Warung' : svc === 'OZMart' ? 'Nama Toko / Pasar' : 'Titik Jemput'}</label><input name="pickupAddress" required placeholder="Contoh: Stasiun Rangkasbitung" class="w-full min-h-[42px] rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 text-sm" /></div>
              <div><label class="block text-xs font-semibold mb-1">Alamat Tujuan / Antar</label><input name="dropoffAddress" required placeholder="Contoh: Perumahan Mabu Blok C" class="w-full min-h-[42px] rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 text-sm" /></div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="block text-xs font-semibold mb-1">Pembayaran</label><select name="paymentMethod" class="w-full min-h-[42px] rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 text-sm"><option>Cash</option><option>QRIS</option><option>Transfer</option></select></div>
                <div><label class="block text-xs font-semibold mb-1">Catatan / Menu</label><input name="notes" placeholder="Opsional" class="w-full min-h-[42px] rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 px-3 text-sm" /></div>
              </div>
              <div class="pt-2 flex gap-2">
                <button type="submit" name="mode" value="save" class="flex-1 min-h-[44px] rounded-xl bg-emerald-600 hover:bg-emerald-700 text-xs font-bold text-white cursor-pointer">Simpan &amp; Chat Driver</button>
                <button type="submit" name="mode" value="wa" class="flex-1 min-h-[44px] rounded-xl border border-emerald-500/40 text-xs font-bold text-emerald-600 dark:text-emerald-300 cursor-pointer">Simpan + Kirim WA</button>
              </div>
            </form>
          </div>
        `;
        return;
      }

      if (state.ozbudemenOpen) {
        root.innerHTML = `
          <div role="dialog" aria-modal="true" class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
            <div class="w-full max-w-sm rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 p-6 text-center space-y-4">
              <div class="text-3xl">👑</div>
              <h3 class="text-lg font-bold">OZbudemen</h3>
              <p class="text-xs text-slate-500">Bayar 1 kali nikmati layanan prioritas warga Mabu selama 1 bulan penuh.</p>
              <div class="flex gap-2">
                <button type="button" id="btn-close-modal" class="flex-1 min-h-[44px] rounded-xl border border-slate-300 dark:border-slate-700 text-xs font-semibold cursor-pointer">Tutup</button>
                <button type="button" id="btn-wa-ozb" class="flex-1 min-h-[44px] rounded-xl bg-emerald-600 text-xs font-bold text-white cursor-pointer">Hubungi Admin</button>
              </div>
            </div>
          </div>
        `;
        return;
      }
      root.innerHTML = '';
    }

    function render() {
      renderHeader();
      renderMobileNav();
      const root = document.getElementById('app-root');
      if (state.portal === 'customer') root.innerHTML = renderCustomer();
      else if (state.portal === 'auth') root.innerHTML = renderAuth();
      else if (state.portal === 'driver') root.innerHTML = renderDriver();
      else if (state.portal === 'admin') root.innerHTML = state.isSuperAdmin ? renderAdmin() : renderAuth();

      if (state.portal === 'customer' && state.customerTab === 'beranda') {
        mountLeafletMap('customer-map', state.drivers.filter((d) => d.isOnline && d.approvalStatus === 'approved'));
      } else if (state.portal === 'driver') {
        const d = getActiveDriver();
        if (d) mountLeafletMap('driver-map', [d]);
      } else if (state.portal === 'admin' && state.isSuperAdmin && state.adminSection === 'map') {
        mountLeafletMap('admin-map', state.drivers);
      }
    }

    // ===== GLOBAL EVENT DELEGATION =====
    document.addEventListener('click', async (e) => {
      const t = e.target.closest('button');
      if (!t) return;

      if (t.dataset.navPortal) {
        const next = t.dataset.navPortal;
        if (next === 'admin' && !state.isSuperAdmin) return;
        state.portal = next; render(); return;
      }
      if (t.dataset.openAuth) {
        const tab = t.dataset.openAuth;
        if (tab === 'driver-login' && state.activeDriverUid) { state.portal = 'driver'; render(); return; }
        state.authTab = tab; state.portal = 'auth'; render(); return;
      }
      if (t.dataset.ctab) { state.customerTab = t.dataset.ctab; render(); return; }
      if (t.dataset.authtab) { state.authTab = t.dataset.authtab; render(); return; }
      if (t.dataset.ofilter) { state.orderFilter = t.dataset.ofilter; render(); return; }
      if (t.dataset.asec) { state.adminSection = t.dataset.asec; render(); return; }
      if (t.dataset.adfilter) { state.adminDriverFilter = t.dataset.adfilter; render(); return; }
      if (t.dataset.openService) { state.orderModalService = t.dataset.openService; renderModal(); return; }
      if (t.dataset.openChat) {
        state.activeChatOrderId = t.dataset.openChat;
        state.activeChatRole = t.dataset.chatRole || 'customer';
        state.unread[state.activeChatOrderId] = 0;
        renderModal(); render(); return;
      }
      if (t.dataset.quickChat) { sendChatMessage(state.activeChatOrderId, t.dataset.quickChat, state.activeChatRole); return; }
      if (t.dataset.toggleSound) {
        state.soundEnabled = !state.soundEnabled;
        localStorage.setItem('ozgo_gh_sound', state.soundEnabled ? 'on' : 'off');
        if (state.soundEnabled) playChatChime();
        showToast(state.soundEnabled ? 'Suara notifikasi chat diaktifkan' : 'Suara notifikasi chat dimatikan', 'info');
        renderModal(); render(); return;
      }
      if (t.dataset.testSound) { playChatChime(); showToast('Nada notifikasi chat masuk diputar', 'info'); return; }
      if (t.id === 'btn-close-modal') { state.activeChatOrderId = null; state.orderModalService = null; state.ozbudemenOpen = false; renderModal(); return; }
      if (t.id === 'btn-ozbudemen') { state.ozbudemenOpen = true; renderModal(); return; }
      if (t.id === 'btn-wa-ozb') { state.ozbudemenOpen = false; renderModal(); openWA('Halo Admin OZgo, saya ingin mengaktifkan paket OZbudemen.'); return; }
      if (t.id === 'btn-wa-cs') { openWA('Halo CS OZgo, saya ingin bertanya.'); return; }
      if (t.id === 'btn-toggle-theme') {
        state.isDark = !state.isDark;
        document.documentElement.classList.toggle('dark', state.isDark);
        localStorage.setItem('ozgo_gh_theme', state.isDark ? 'dark' : 'light');
        render(); return;
      }
      if (t.dataset.demoDriver) {
        state.isSuperAdmin = false; state.activeDriverUid = t.dataset.demoDriver; state.portal = 'driver';
        showToast('Masuk Mode Driver Motor', 'success'); render(); return;
      }
      if (t.id === 'btn-demo-admin') {
        state.isSuperAdmin = true; state.activeDriverUid = CONFIG.superAdminDriverUid; state.portal = 'admin';
        showToast('Masuk Konsol Super Admin (termasuk Driver OZgo)', 'success'); render(); return;
      }
      if (t.id === 'btn-google-driver' || t.id === 'btn-google-admin') {
        if (!fbAuth || !googleProvider) { showToast('Firebase Auth tidak tersedia di browser ini.', 'error'); return; }
        try {
          const cred = await signInWithPopup(fbAuth, googleProvider);
          const isSA = (cred.user.email || '').toLowerCase() === CONFIG.superAdminEmail.toLowerCase();
          if (t.id === 'btn-google-admin' && !isSA) {
            await signOut(fbAuth);
            showToast('Akses ditolak: akun bukan Super Admin.', 'error'); return;
          }
          state.isSuperAdmin = isSA;
          state.activeDriverUid = isSA ? CONFIG.superAdminDriverUid : cred.user.uid;
          state.portal = t.id === 'btn-google-admin' ? 'admin' : 'driver';
          showToast(isSA ? 'Login Super Admin + Driver OZgo berhasil' : 'Login Google Driver berhasil', 'success');
          render();
        } catch (err) {
          showToast('Login Google dibatalkan atau domain belum didaftarkan di Firebase Authorized Domains.', 'error');
        }
        return;
      }
      if (t.id === 'btn-logout') {
        stopGps();
        if (fbAuth && state.firebaseUser) { try { await signOut(fbAuth); } catch {} }
        state.isSuperAdmin = false; state.activeDriverUid = null; state.adminGateUnlocked = false; state.portal = 'customer';
        showToast('Sesi ditutup', 'info'); render(); return;
      }
      if (t.id === 'btn-go-online' || t.id === 'btn-go-offline') {
        const d = getActiveDriver(); if (!d) return;
        const next = t.id === 'btn-go-online';
        d.isOnline = next; if (!next) { d.speed = 0; stopGps(); }
        persistAll();
        showToast(next ? 'Status ONLINE aktif — lokasi motor dibagikan' : 'Status OFFLINE — GPS dihentikan', next ? 'success' : 'info');
        render(); return;
      }
      if (t.id === 'btn-gps-sim') { toggleGpsSim(); return; }
      if (t.dataset.approve || t.dataset.suspend || t.dataset.forceOff) {
        const uid = t.dataset.approve || t.dataset.suspend || t.dataset.forceOff;
        const d = state.drivers.find((x) => x.uid === uid); if (!d) return;
        if (t.dataset.approve) { d.approvalStatus = 'approved'; showToast(`${d.name} disetujui`, 'success'); }
        if (t.dataset.suspend) { d.approvalStatus = 'suspended'; d.isOnline = false; showToast(`${d.name} dinonaktifkan`, 'info'); }
        if (t.dataset.forceOff) { d.isOnline = false; d.speed = 0; showToast(`${d.name} diubah ke Offline`, 'info'); }
        persistAll(); render(); return;
      }
      if (t.dataset.orderStatus) {
        const [oid, st] = t.dataset.orderStatus.split(':');
        const o = state.orders.find((x) => x.orderId === oid);
        if (o) { o.status = st; persistAll(); showToast(`Pesanan #${oid}: ${statusLabel(st)}`, 'success'); render(); }
        return;
      }
    });

    document.addEventListener('change', (e) => {
      if (e.target.dataset.assignOrder && e.target.value) {
        const o = state.orders.find((x) => x.orderId === e.target.dataset.assignOrder);
        const d = state.drivers.find((x) => x.uid === e.target.value);
        if (o && d) {
          o.assignedDriverId = d.uid; o.assignedDriverName = d.name; o.status = 'assigned';
          persistAll(); showToast(`Driver ${d.name} ditugaskan ke #${o.orderId}`, 'success'); render();
        }
      }
    });

    document.addEventListener('input', (e) => {
      if (e.target.id === 'svc-search') { state.searchQuery = e.target.value; render(); document.getElementById('svc-search')?.focus(); }
    });

    document.addEventListener('submit', (e) => {
      e.preventDefault();
      if (e.target.id === 'profile-form') {
        state.profile = { name: document.getElementById('prof-name').value.trim(), phone: document.getElementById('prof-phone').value.trim() };
        persistAll(); showToast('Profil pelanggan disimpan', 'success'); render(); return;
      }
      if (e.target.id === 'driver-reg-form') {
        const fd = new FormData(e.target);
        const uid = 'drv_' + Date.now();
        const drv = {
          uid, name: String(fd.get('name')).trim(), email: String(fd.get('email')).trim(),
          phone: String(fd.get('phone')).trim(), vehicleType: 'motor',
          vehicleModel: String(fd.get('vehicleModel')).trim(), area: String(fd.get('area')).trim(),
          approvalStatus: 'pending', isOnline: false,
          lat: CONFIG.center.lat + (Math.random() - 0.5) * 0.008,
          lng: CONFIG.center.lng + (Math.random() - 0.5) * 0.008, speed: 0,
        };
        state.drivers = [drv, ...state.drivers];
        state.isSuperAdmin = false; state.activeDriverUid = uid; state.portal = 'driver';
        persistAll(); showToast('Pendaftaran driver motor berhasil! Menunggu verifikasi.', 'success'); render(); return;
      }
      if (e.target.id === 'order-create-form') {
        const fd = new FormData(e.target);
        const svc = state.orderModalService;
        const oid = `OZ-${svc.slice(2, 3)}${String(Date.now()).slice(-5)}`;
        const onlineDrv = state.drivers.find((d) => d.isOnline && d.approvalStatus === 'approved' && d.uid !== CONFIG.superAdminDriverUid) || state.drivers[0];
        const pickup = String(fd.get('pickupAddress')).trim();
        const dropoff = String(fd.get('dropoffAddress')).trim();
        const cname = String(fd.get('customerName')).trim();
        const order = {
          orderId: oid, serviceType: svc, customerName: cname, pickupAddress: pickup, dropoffAddress: dropoff,
          summary: `${pickup} → ${dropoff}`, paymentMethod: String(fd.get('paymentMethod')),
          notes: String(fd.get('notes') || '').trim(), status: onlineDrv ? 'assigned' : 'pending',
          assignedDriverId: onlineDrv?.uid || null, assignedDriverName: onlineDrv?.name || null, createdAtMs: Date.now(),
        };
        state.orders = [order, ...state.orders];
        if (onlineDrv) {
          state.chats[oid] = [{
            id: 'm_w_' + Date.now(), orderId: oid, senderRole: 'driver', senderName: onlineDrv.name,
            text: `Halo Kak ${cname}, pesanan ${svc} #${oid} sudah saya terima. Saya ${onlineDrv.name} (${onlineDrv.vehicleModel}) segera meluncur ya!`,
            createdAtMs: Date.now(),
          }];
          state.unread[oid] = 1;
          if (state.soundEnabled) playChatChime();
        }
        persistAll();
        state.orderModalService = null;
        state.customerTab = 'pesanan';
        if (e.submitter?.value === 'wa') openWA(`*PESANAN ${svc} #${oid}*\nNama: ${cname}\nDari: ${pickup}\nTujuan: ${dropoff}\nBayar: ${order.paymentMethod}`);
        showToast(`Pesanan #${oid} dibuat! Anda bisa langsung Chat Driver.`, 'success');
        renderModal(); render(); return;
      }
      if (e.target.id === 'chat-send-form') {
        const inp = document.getElementById('chat-input');
        if (inp && inp.value.trim()) { sendChatMessage(state.activeChatOrderId, inp.value, state.activeChatRole); }
      }
    });

    render();
  </script>
</body>
</html>

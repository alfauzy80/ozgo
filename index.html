<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OZgo — Ojek Online Rangkasbitung</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#00A86B', dark: '#007A4D', light: '#E6F7EF' },
          ink: '#0B1220',
        },
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; overflow: hidden; }
  #map { width: 100%; height: 100vh; z-index: 0; }
  .sheet { z-index: 1000; transition: transform 0.3s ease; }
  .search-input { outline: none; }
  .search-input:focus { border-color: #00A86B; }
  .autocomplete-list { max-height: 250px; overflow-y: auto; z-index: 2000; }
</style>
</head>
<body class="bg-slate-50 text-ink">

  <div id="map"></div>

  <button id="btnBack" onclick="resetApp()" class="hidden absolute top-4 left-4 z-[1000] w-10 h-10 bg-white rounded-full shadow-lg flex items-center justify-center active:scale-95">
    <svg class="w-5 h-5 text-ink" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
  </button>

  <div class="absolute bottom-0 left-0 right-0 bg-white rounded-t-3xl shadow-[0_-10px_40px_rgba(0,0,0,0.1)] sheet max-w-lg mx-auto px-5 pt-3 pb-6" style="max-height: 85vh; overflow-y: auto;">
    <div class="w-12 h-1.5 bg-slate-200 rounded-full mx-auto mb-4"></div>

    <!-- MENU UTAMA -->
    <div id="view-home">
      <h1 class="text-2xl font-extrabold text-ink mb-1">Mau pesan apa hari ini?</h1>
      <p class="text-sm text-slate-500 mb-4">Pilih layanan OZgo favoritmu.</p>
      
      <div class="grid grid-cols-2 gap-3">
        <div onclick="pilihLayanan('OZride', '#00A86B', '🏍️')" class="border border-slate-100 bg-white rounded-2xl p-4 shadow-sm active:scale-95 transition cursor-pointer flex flex-col items-center">
          <div class="w-12 h-12 rounded-xl bg-emerald-100 flex items-center justify-center mb-2 text-2xl">🏍️</div>
          <p class="font-bold text-ink text-sm">OZride</p>
          <p class="text-[11px] text-slate-400">Ojek Motor</p>
        </div>
        <div onclick="pilihLayanan('OZfood', '#EF4444', '🍱')" class="border border-slate-100 bg-white rounded-2xl p-4 shadow-sm active:scale-95 transition cursor-pointer flex flex-col items-center">
          <div class="w-12 h-12 rounded-xl bg-red-100 flex items-center justify-center mb-2 text-2xl">🍱</div>
          <p class="font-bold text-ink text-sm">OZfood</p>
          <p class="text-[11px] text-slate-400">Pesan Makanan</p>
        </div>
        <div onclick="pilihLayanan('OZsend', '#F97316', '📦')" class="border border-slate-100 bg-white rounded-2xl p-4 shadow-sm active:scale-95 transition cursor-pointer flex flex-col items-center">
          <div class="w-12 h-12 rounded-xl bg-orange-100 flex items-center justify-center mb-2 text-2xl">📦</div>
          <p class="font-bold text-ink text-sm">OZsend</p>
          <p class="text-[11px] text-slate-400">Kirim Barang</p>
        </div>
        <div onclick="pilihLayanan('OZmart', '#8B5CF6', '🛒')" class="border border-slate-100 bg-white rounded-2xl p-4 shadow-sm active:scale-95 transition cursor-pointer flex flex-col items-center">
          <div class="w-12 h-12 rounded-xl bg-purple-100 flex items-center justify-center mb-2 text-2xl">🛒</div>
          <p class="font-bold text-ink text-sm">OZmart</p>
          <p class="text-[11px] text-slate-400">Belanja Harian</p>
        </div>
      </div>
    </div>

    <!-- FORM PESANAN -->
    <div id="view-order" class="hidden">
      <div class="flex items-center gap-3 mb-4">
        <div id="icon-layanan" class="w-10 h-10 rounded-xl flex items-center justify-center text-white font-bold text-xl"></div>
        <div>
          <h2 id="title-layanan" class="text-lg font-extrabold text-ink">OZride</h2>
          <p class="text-xs text-slate-500">Tentukan lokasi Anda</p>
        </div>
      </div>

      <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-3 relative">
        <div class="flex items-center gap-3 mb-1">
          <span class="w-2.5 h-2.5 rounded-full bg-brand ring-4 ring-emerald-100"></span>
          <input type="text" id="input-jemput" placeholder="Ketik Lokasi Jemput..." class="search-input w-full bg-transparent text-sm font-semibold text-ink placeholder-slate-400" oninput="cariLokasi(this.value, 'jemput')">
        </div>
        
        <hr class="border-slate-200 ml-6 mb-2 mt-2">
        
        <div class="flex items-center gap-3 mb-1">
          <span class="w-2.5 h-2.5 rounded-full bg-red-500 ring-4 ring-red-100"></span>
          <input type="text" id="input-tujuan" placeholder="Ketik Lokasi Tujuan..." class="search-input w-full bg-transparent text-sm font-semibold text-ink placeholder-slate-400" oninput="cariLokasi(this.value, 'tujuan')">
        </div>

        <!-- Autocomplete -->
        <div id="list-jemput" class="autocomplete-list absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg hidden"></div>
        <div id="list-tujuan" class="autocomplete-list absolute left-0 right-0 mt-1 bg-white border border-slate-200 rounded-xl shadow-lg hidden"></div>
      </div>

      <!-- Info Tarif -->
      <div id="info-tarif" class="hidden bg-emerald-50 border border-emerald-100 rounded-xl p-3 mb-3 flex items-center justify-between">
        <div>
          <p class="text-[10px] text-slate-500 font-semibold uppercase">Jarak Tempuh</p>
          <p id="txt-jarak" class="text-sm font-bold text-ink">0 km</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] text-slate-500 font-semibold uppercase">Total Tarif</p>
          <p id="txt-tarif" class="text-lg font-extrabold text-brand">Rp 0</p>
        </div>
      </div>

      <div id="loading-rute" class="hidden items-center justify-center gap-2 mb-3">
        <div class="flex space-x-1">
            <div class="w-2 h-2 bg-emerald-500 rounded-full animate-bounce"></div>
            <div class="w-2 h-2 bg-emerald-500 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
            <div class="w-2 h-2 bg-emerald-500 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
        </div>
        <p class="text-xs text-slate-500 font-semibold">Menghitung rute...</p>
      </div>

      <p class="text-xs font-bold text-slate-500 uppercase mb-2 mt-4">Metode Pembayaran</p>
      <select id="metode-bayar" class="w-full bg-slate-50 border border-slate-200 text-sm font-semibold rounded-xl p-3 mb-4 outline-none">
        <option value="Cash / Tunai">💵 Cash / Tunai</option>
        <option value="QRIS">▦ QRIS</option>
        <option value="Transfer Bank">🏦 Transfer Bank</option>
        <option value="E-Wallet (GoPay/OVO/DANA)">📱 E-Wallet</option>
      </select>

      <button id="btn-pesan" onclick="prosesPesanan()" class="w-full bg-brand hover:bg-brand-dark text-white font-bold text-sm py-4 rounded-xl shadow-lg transition disabled:opacity-50 disabled:cursor-not-allowed" disabled>
        Lengkapi Lokasi
      </button>
    </div>
  </div>

  <script>
    const map = L.map('map', { zoomControl: false }).setView([-6.3591, 106.2494], 14);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);

    let pickupMarker = null;
    let destMarker = null;
    let routeLine = null;

    const WA_NUMBER = "628568080847"; // GANTI NOMOR WA ANDA
    let layananAktif = 'OZride';
    let koordinatJemput = null;
    let koordinatTujuan = null;
    let jarakKm = 0;
    let totalTarif = 0;

    function pilihLayanan(nama, warna, emoji) {
      layananAktif = nama;
      document.getElementById('title-layanan').textContent = nama;
      const iconDiv = document.getElementById('icon-layanan');
      iconDiv.style.backgroundColor = warna;
      iconDiv.textContent = emoji;
      document.getElementById('view-home').classList.add('hidden');
      document.getElementById('view-order').classList.remove('hidden');
      document.getElementById('btnBack').classList.remove('hidden');
      document.getElementById('info-tarif').classList.add('hidden');
      
      const btn = document.getElementById('btn-pesan');
      btn.disabled = true;
      btn.textContent = 'Lengkapi Lokasi';
      btn.classList.add('bg-slate-400');
      btn.classList.remove('bg-brand');
    }

    function resetApp() {
      document.getElementById('view-order').classList.add('hidden');
      document.getElementById('view-home').classList.remove('hidden');
      document.getElementById('btnBack').classList.add('hidden');
      document.getElementById('input-jemput').value = '';
      document.getElementById('input-tujuan').value = '';
      document.getElementById('list-jemput').classList.add('hidden');
      document.getElementById('list-tujuan').classList.add('hidden');
      if(pickupMarker) map.removeLayer(pickupMarker);
      if(destMarker) map.removeLayer(destMarker);
      if(routeLine) map.removeLayer(routeLine);
      koordinatJemput = null;
      koordinatTujuan = null;
      jarakKm = 0;
      map.setView([-6.3591, 106.2494], 14);
    }

    // ==========================================
    // PENCARIAN LOKASI: OTOMATIS ATAU TEKS MANUAL
    // ==========================================
    let timeoutSearch = null;
    function cariLokasi(query, tipe) {
      clearTimeout(timeoutSearch);
      const listDiv = document.getElementById(`list-${tipe}`);
      
      if (query.length < 3) {
        listDiv.classList.add('hidden');
        return;
      }

      timeoutSearch = setTimeout(async () => {
        listDiv.innerHTML = '<div class="p-3 text-xs text-slate-500 text-center">Mencari...</div>';
        listDiv.classList.remove('hidden');

        try {
          const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ' Rangkasbitung')}&limit=10&countrycodes=id&accept-language=id`;
          const res = await fetch(url);
          const data = await res.json();

          listDiv.innerHTML = '';
          
          if (data.length === 0) {
            // JIKA TIDAK KETEMU, TAWARKAN TEKS MANUAL (Seperti Google Sites)
            listDiv.innerHTML = `
              <div class="p-4 text-center">
                <p class="text-xs text-slate-600 mb-2">Tempat tidak ada di peta, tapi tidak masalah!</p>
                <button onclick="gunakanTeksManual('${tipe}', '${query}')" class="bg-brand text-white text-xs font-bold px-4 py-2.5 rounded-lg w-full shadow-md">
                  Gunakan "${query}" (Kirim ke Admin)
                </button>
              </div>
            `;
          } else {
            data.forEach(item => {
              const div = document.createElement('div');
              div.className = 'p-3 text-xs border-b border-slate-100 cursor-pointer hover:bg-slate-50';
              const namaTempat = item.name || item.display_name.split(',')[0];
              div.innerHTML = `<p class="font-bold text-ink">${namaTempat}</p><p class="text-slate-400 text-[10px]">${item.display_name}</p>`;
              div.onclick = () => pilihLokasi(item.lat, item.lon, namaTempat, tipe);
              listDiv.appendChild(div);
            });
          }
        } catch (error) {
            listDiv.innerHTML = `<div class="p-3 text-xs text-red-500 text-center">Koneksi lambat.</div>`;
        }
      }, 800);
    }

    // Fungsi jika user memilih tetap pakai teks manual (tanpa koordinat peta)
    function gunakanTeksManual(tipe, teks) {
      document.getElementById(`input-${tipe}`).value = teks;
      document.getElementById(`list-${tipe}`).classList.add('hidden');
      
      if (tipe === 'jemput') {
        koordinatJemput = "manual";
        if(pickupMarker) map.removeLayer(pickupMarker);
      } else {
        koordinatTujuan = "manual";
        if(destMarker) map.removeLayer(destMarker);
      }

      cekTombolPesan();
    }

    function pilihLokasi(lat, lon, nama, tipe) {
      const pos = [parseFloat(lat), parseFloat(lon)];
      document.getElementById(`input-${tipe}`).value = nama;
      document.getElementById(`list-${tipe}`).classList.add('hidden');

      if (tipe === 'jemput') {
        koordinatJemput = pos;
        if (pickupMarker) map.removeLayer(pickupMarker);
        pickupMarker = L.marker(pos, { draggable: false }).addTo(map);
        map.setView(pos, 15);
      } else {
        koordinatTujuan = pos;
        if (destMarker) map.removeLayer(destMarker);
        destMarker = L.marker(pos, { draggable: false }).addTo(map);
        map.setView(pos, 15);
      }

      cekTombolPesan();
    }

    // Mengecek apakah kedua kolom sudah terisi
    function cekTombolPesan() {
      const btn = document.getElementById('btn-pesan');
      
      if (koordinatJemput && koordinatTujuan) {
        btn.disabled = false;
        btn.classList.remove('bg-slate-400');
        btn.classList.add('bg-brand');
        
        // Jika kedua-duanya punya koordinat peta, hitung rute jarak
        if (koordinatJemput !== "manual" && koordinatTujuan !== "manual") {
          hitungRute();
        } else {
          // Jika salah satu manual (teks), kita tidak bisa hitung jarak otomatis
          document.getElementById('info-tarif').classList.add('hidden');
          btn.textContent = `Pesan ${layananAktif} Sekarang`;
        }
      }
    }

    function hitungRute() {
      document.getElementById('loading-rute').classList.remove('hidden');
      document.getElementById('loading-rute').classList.add('flex');
      
      const url = `https://router.project-osrm.org/route/v1/driving/${koordinatJemput[1]},${koordinatJemput[0]};${koordinatTujuan[1]},${koordinatTujuan[0]}?overview=full&geometries=geojson`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          document.getElementById('loading-rute').classList.add('hidden');
          document.getElementById('loading-rute').classList.remove('flex');

          if (data.code === 'Ok') {
            const jarakMeter = data.routes[0].distance;
            jarakKm = parseFloat((jarakMeter / 1000).toFixed(1));
            
            let dasar = jarakKm * 2300;
            totalTarif = Math.ceil(dasar / 100) * 100;
            if (totalTarif < 8000) totalTarif = 8000;

            if (routeLine) map.removeLayer(routeLine);
            routeLine = L.geoJSON(data.routes[0].geometry, { style: { color: '#00A86B', weight: 6, opacity: 0.8 } }).addTo(map);
            
            map.fitBounds(routeLine.getBounds(), { padding: [50, 50] });

            document.getElementById('txt-jarak').textContent = jarakKm + ' km';
            document.getElementById('txt-tarif').textContent = formatRp(totalTarif);
            document.getElementById('info-tarif').classList.remove('hidden');

            const btn = document.getElementById('btn-pesan');
            btn.textContent = `Pesan ${layananAktif} • ${formatRp(totalTarif)}`;
          }
        })
        .catch(err => {
          document.getElementById('loading-rute').classList.add('hidden');
        });
    }

    function formatRp(n) { return 'Rp ' + n.toLocaleString('id-ID'); }

    // ==========================================
    // KIRIM PESANAN KE WHATSAPP
    // ==========================================
    function prosesPesanan() {
      const jemput = document.getElementById('input-jemput').value;
      const tujuan = document.getElementById('input-tujuan').value;
      const metode = document.getElementById('metode-bayar').value;

      let infoJarak = "Akan dihitung oleh Admin";
      let infoTarif = "Menyesuaikan jarak";

      if (koordinatJemput !== "manual" && koordinatTujuan !== "manual" && jarakKm > 0) {
          infoJarak = jarakKm + " km";
          infoTarif = formatRp(totalTarif);
      }

      const pesan = `Halo Admin *OZgo*, saya ingin memesan:%0A%0A` +
                    `*Layanan:* ${layananAktif}%0A` +
                    `*Jemput:* ${jemput}%0A` +
                    `*Tujuan:* ${tujuan}%0A` +
                    `*Jarak:* ${infoJarak}%0A` +
                    `*Tarif:* ${infoTarif}%0A` +
                    `*Pembayaran:* ${metode}%0A%0A` +
                    `Mohon segera diproses ya. Terima kasih!`;

      window.open(`https://wa.me/${WA_NUMBER}?text=${pesan}`, '_blank');
      setTimeout(() => { resetApp(); }, 1000);
    }
  </script>
</body>
</html>

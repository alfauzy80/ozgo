<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>OZgo — Pesan Layanan</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          brand: { DEFAULT: '#00A86B', dark: '#007A4D', light: '#E6F7EF' },
          ink: '#0B1220',
          inputbg: '#1A2235'
        },
        fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
      }
    }
  }
</script>
<style>
  body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; background-color: #0B1220; color: #ffffff; }
  .app-page { display: none; animation: fadeIn 0.2s ease; }
  .app-page.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
  .input-dark { background-color: #1A2235; border: 1px solid #2A364F; color: #ffffff; outline: none; }
  .input-dark:focus { border-color: #00A86B; box-shadow: 0 0 0 2px rgba(0,168,107,0.2); }
  .input-dark::placeholder { color: #64748B; }
</style>
</head>
<body class="min-h-screen">

  <!-- ========================================== -->
  <!-- HALAMAN 1: BERANDA (MENU)                  -->
  <!-- ========================================== -->
  <div id="page-home" class="app-page active p-5 max-w-lg mx-auto pt-10">
    <h1 class="text-2xl font-extrabold mb-1">Mau pesan apa hari ini?</h1>
    <p class="text-sm text-slate-400 mb-6">Pilih layanan OZgo favoritmu.</p>
    
    <div class="grid grid-cols-2 gap-4">
      <!-- OZride -->
      <div onclick="bukaForm('OZride')" class="bg-[#1A2235] border border-[#2A364F] rounded-2xl p-4 shadow-sm active:scale-95 transition cursor-pointer flex flex-col items-center">
        <div class="w-12 h-12 rounded-xl bg-emerald-500/20 flex items-center justify-center mb-3 text-2xl">🏍️</div>
        <p class="font-bold text-white text-sm">OZride</p>
        <p class="text-[11px] text-slate-400">Ojek Motor</p>
      </div>
      <!-- OZfood -->
      <div onclick="bukaForm('OZfood')" class="bg-[#1A2235] border border-[#2A364F] rounded-2xl p-4 shadow-sm active:scale-95 transition cursor-pointer flex flex-col items-center">
        <div class="w-12 h-12 rounded-xl bg-red-500/20 flex items-center justify-center mb-3 text-2xl">🍱</div>
        <p class="font-bold text-white text-sm">OZfood</p>
        <p class="text-[11px] text-slate-400">Pesan Makanan</p>
      </div>
      <!-- OZsend -->
      <div onclick="bukaForm('OZsend')" class="bg-[#1A2235] border border-[#2A364F] rounded-2xl p-4 shadow-sm active:scale-95 transition cursor-pointer flex flex-col items-center">
        <div class="w-12 h-12 rounded-xl bg-orange-500/20 flex items-center justify-center mb-3 text-2xl">📦</div>
        <p class="font-bold text-white text-sm">OZsend</p>
        <p class="text-[11px] text-slate-400">Kirim Barang</p>
      </div>
      <!-- OZmart -->
      <div onclick="bukaForm('OZmart')" class="bg-[#1A2235] border border-[#2A364F] rounded-2xl p-4 shadow-sm active:scale-95 transition cursor-pointer flex flex-col items-center">
        <div class="w-12 h-12 rounded-xl bg-purple-500/20 flex items-center justify-center mb-3 text-2xl">🛒</div>
        <p class="font-bold text-white text-sm">OZmart</p>
        <p class="text-[11px] text-slate-400">Belanja Harian</p>
      </div>
    </div>
  </div>

  <!-- ========================================== -->
  <!-- HALAMAN 2: FORM PESANAN (PERSIS SS)        -->
  <!-- ========================================== -->
  <div id="page-form" class="app-page pb-10 max-w-lg mx-auto">
    
    <!-- Header Form -->
    <div class="bg-[#0F172A] p-5 flex items-center gap-4 border-b border-[#1E293B] sticky top-0 z-50">
      <button onclick="kembaliKeHome()" class="w-10 h-10 rounded-full bg-[#1E293B] flex items-center justify-center active:scale-90 transition">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <div>
        <h2 id="header-title" class="text-lg font-bold text-white leading-tight">Pesan OZRide</h2>
        <p class="text-[11px] text-slate-400">Area Rangkasbitung & Sekitarnya</p>
      </div>
    </div>

    <div class="p-5 space-y-4">
      <!-- Nama Pemesan -->
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Nama Pemesan</label>
        <input type="text" id="input-nama" placeholder="Masukkan nama Anda" class="w-full input-dark rounded-xl p-3.5 text-sm font-semibold transition">
      </div>

      <!-- Titik Jemput -->
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Titik Jemput (Alamat/Patokan)</label>
        <div class="flex gap-2">
          <input type="text" id="input-jemput" placeholder="Contoh: Mabu Park" class="w-full input-dark rounded-xl p-3.5 text-sm font-semibold transition">
          <!-- Tombol GPS -->
          <button onclick="deteksiLokasi()" class="w-14 bg-[#1A2235] border border-[#2A364F] rounded-xl flex items-center justify-center active:scale-95 transition flex-shrink-0">
            <svg class="w-6 h-6 text-brand" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8a4 4 0 100 8 4 4 0 000-8z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 2v2m0 16v2M2 12h2m16 0h2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M4.93 19.07l1.41-1.41m11.32-11.32l1.41-1.41"/></svg>
          </button>
        </div>
      </div>

      <!-- Titik Pengantaran -->
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Titik Pengantaran (Tujuan)</label>
        <input type="text" id="input-tujuan" placeholder="Contoh: Labbaik" class="w-full input-dark rounded-xl p-3.5 text-sm font-semibold transition">
      </div>

      <!-- Keterangan Tambahan -->
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Keterangan Tambahan (Opsional)</label>
        <textarea id="input-keterangan" rows="3" placeholder="Ciri-ciri pakaian, warna rumah, dll." class="w-full input-dark rounded-xl p-3.5 text-sm font-semibold transition"></textarea>
      </div>

      <!-- Metode Pembayaran -->
      <div>
        <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">Metode Pembayaran</label>
        <div class="relative">
          <select id="input-metode" class="w-full input-dark rounded-xl p-3.5 text-sm font-semibold appearance-none transition">
            <option value="Cash (Tunai)">Cash (Tunai)</option>
            <option value="QRIS">QRIS</option>
            <option value="Transfer Bank">Transfer Bank</option>
            <option value="E-Wallet (GoPay/OVO/DANA)">E-Wallet</option>
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
          </div>
        </div>
      </div>

      <!-- Tombol Pesan -->
      <div class="pt-4">
        <button onclick="kirimPesanan()" class="w-full bg-brand hover:bg-brand-dark text-white font-bold text-base py-4 rounded-xl shadow-[0_4px_20px_rgba(0,168,107,0.3)] transition flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.1-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-.3-.1-1.2-.5-2.3-1.4-.8-.7-1.4-1.6-1.5-1.9-.2-.3 0-.4.1-.6.1-.1.3-.3.4-.5.1-.2.2-.3.3-.5.1-.2 0-.3 0-.5 0-.1-.7-1.6-.9-2.2-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.4 0 1.4 1 2.8 1.2 3 .1.2 2 3.1 4.9 4.3.7.3 1.2.5 1.6.6.7.2 1.3.2 1.8.1.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.2-.5-.3zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.8L2 22l5.3-1.3c1.4.7 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
          Pesan Sekarang
        </button>
      </div>
      
      <p class="text-center text-[10px] text-slate-500 mt-2">Pesanan akan diteruskan ke WhatsApp Admin OZgo.</p>
    </div>
  </div>

  <script>
    const WA_NUMBER = "628568080847"; // GANTI NOMOR WA ANDA
    let layananAktif = 'OZRide';

    // Navigasi Pindah Halaman
    function navTo(pageId) {
      document.querySelectorAll('.app-page').forEach(page => {
        page.classList.remove('active');
      });
      document.getElementById(pageId).classList.add('active');
      window.scrollTo(0, 0);
    }

    // Buka Form Layanan
    function bukaForm(namaLayanan) {
      layananAktif = namaLayanan;
      document.getElementById('header-title').textContent = `Pesan ${namaLayanan}`;
      
      // Reset form setiap kali dibuka
      document.getElementById('input-nama').value = '';
      document.getElementById('input-jemput').value = '';
      document.getElementById('input-tujuan').value = '';
      document.getElementById('input-keterangan').value = '';
      
      navTo('page-form');
    }

    // Kembali ke Menu Utama
    function kembaliKeHome() {
      navTo('page-home');
    }

    // Fitur Tombol GPS (Deteksi Lokasi Otomatis)
    function deteksiLokasi() {
      const btn = event.currentTarget;
      const icon = btn.innerHTML;
      
      if (navigator.geolocation) {
        btn.innerHTML = `<div class="w-5 h-5 border-2 border-brand border-t-transparent rounded-full animate-spin"></div>`;
        
        navigator.geolocation.getCurrentPosition(
          (position) => {
            // Karena kita tidak pakai peta, kita isi dengan koordinat (Admin tinggal klik di WA)
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            document.getElementById('input-jemput').value = `https://maps.google.com/?q=${lat},${lon}`;
            btn.innerHTML = icon;
          },
          (error) => {
            alert("Gagal mendeteksi lokasi. Pastikan GPS HP aktif dan izin browser diizinkan.");
            btn.innerHTML = icon;
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
      } else {
        alert("Browser Anda tidak mendukung fitur deteksi lokasi.");
      }
    }

    // Kirim ke WhatsApp
    function kirimPesanan() {
      const nama = document.getElementById('input-nama').value.trim();
      const jemput = document.getElementById('input-jemput').value.trim();
      const tujuan = document.getElementById('input-tujuan').value.trim();
      const ket = document.getElementById('input-keterangan').value.trim();
      const metode = document.getElementById('input-metode').value;

      // Validasi Kolom Wajib
      if (!nama || !jemput || !tujuan) {
        alert("Mohon lengkapi Nama, Titik Jemput, dan Titik Pengantaran.");
        return;
      }

      // Susun Pesan WhatsApp
      let pesan = `Halo Admin *OZgo*, saya ingin memesan:%0A%0A`;
      pesan += `*Layanan:* ${layananAktif}%0A`;
      pesan += `*Nama:* ${nama}%0A`;
      pesan += `*Jemput:* ${jemput}%0A`;
      pesan += `*Tujuan:* ${tujuan}%0A`;
      pesan += `*Pembayaran:* ${metode}%0A`;
      
      if (ket) {
        pesan += `*Catatan:* ${ket}%0A`;
      }
      
      pesan += `%0AMohon segera diproses ya. Terima kasih!`;

      // Buka WhatsApp
      window.open(`https://wa.me/${WA_NUMBER}?text=${pesan}`, '_blank');
    }
  </script>
</body>
</html>
